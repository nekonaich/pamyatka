<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Памятка военнослужащего: субординация, строй, экзамен</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBE4; --surface:#F6F7F3; --ink:#1C231D; --muted:#55604F;
  --olive:#3F5236; --olive-ink:#F4F6EF; --brass:#A67C1F; --red:#9E3426;
  --ok:#2F6B3A; --line:#C9D0C2; --mark:#F0D77A;
  --head:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"PT Sans","Segoe UI",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141914; --surface:#1D241D; --ink:#E6EBE0; --muted:#9AA595;
    --olive:#2E3E28; --olive-ink:#EEF2E8; --brass:#D1A94A; --red:#E0806F;
    --ok:#7DBB86; --line:#2E382D; --mark:#6B5A1A;
  }
}
:root[data-theme="dark"]{
  --bg:#141914; --surface:#1D241D; --ink:#E6EBE0; --muted:#9AA595;
  --olive:#2E3E28; --olive-ink:#EEF2E8; --brass:#D1A94A; --red:#E0806F;
  --ok:#7DBB86; --line:#2E382D; --mark:#6B5A1A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.55 var(--body)}
h1,h2,h3{font-family:var(--head);font-weight:600;line-height:1.15;margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--olive);color:var(--olive-ink);border-bottom:4px solid var(--brass)}
.top-in{max-width:1080px;margin:0 auto;padding:14px 18px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:26px;letter-spacing:.02em}
.brand small{opacity:.8;font-size:14px}
.search{display:flex;align-items:center;gap:10px;margin:12px 0 0;background:var(--surface);color:var(--ink);border-radius:6px;padding:0 12px;border:2px solid transparent}
.search:focus-within{border-color:var(--brass)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:inherit;font:inherit;padding:12px 0;outline:none}
.search kbd{font:12px var(--body);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.search button{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 6px;display:none}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.tab{border:0;background:transparent;color:var(--olive-ink);opacity:.8;padding:10px 16px;font-family:var(--head);font-size:18px;letter-spacing:.03em;border-radius:6px 6px 0 0;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1}

main{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
.panel[hidden]{display:none}
.notice{border-left:5px solid var(--brass);background:var(--surface);padding:12px 16px;border-radius:0 6px 6px 0;margin:0 0 22px;font-size:15px;color:var(--muted)}
.notice b{color:var(--ink)}

/* phrase tiles: the one memorable element */
.phrases{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:6px 0 4px}
.phrase{background:var(--olive);color:var(--olive-ink);padding:14px 16px 14px 18px;border-radius:4px;border-left:8px solid var(--brass);position:relative}
.phrase.no{border-left-color:var(--red)}
.phrase strong{display:block;font-family:var(--head);font-size:26px;letter-spacing:.04em;line-height:1.1}
.phrase span{display:block;margin-top:4px;font-size:14px;opacity:.85}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chip{border:1.5px solid var(--olive);background:transparent;border-radius:999px;padding:6px 14px;font-size:15px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--olive);color:var(--olive-ink)}

.grid{column-count:2;column-gap:16px}
.grid>.card{break-inside:avoid;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.card.wide{column-span:all}
.card h3{font-size:22px;margin:4px 0 10px}
.tag{display:inline-block;font-size:13px;color:var(--brass);font-weight:700}
.card p{margin:0 0 10px}
.card ul,.card ol{margin:0 0 10px;padding-left:22px}
.card li{margin:3px 0}
.quote{border-left:4px solid var(--olive);padding:6px 14px;margin:10px 0;background:color-mix(in srgb,var(--olive) 8%,transparent)}
.ban li::marker{content:"✕  ";color:var(--red);font-weight:700}
.src{display:inline-block;margin-left:6px;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted);vertical-align:middle}
.ladder{list-style:none;padding:0;margin:8px 0 10px;display:grid;gap:6px}
.ladder li{display:flex;gap:12px;align-items:center;padding:8px 12px;border-radius:4px;background:var(--bg);border-left:6px solid var(--line);margin:0}
.ladder li b{font-family:var(--head);font-weight:500;min-width:1.2em;color:var(--muted)}
.ladder li:nth-child(1){border-left-color:#7a9a5a}
.ladder li:nth-child(2){border-left-color:#a8a24a}
.ladder li:nth-child(3){border-left-color:var(--brass)}
.ladder li:nth-child(4){border-left-color:#b9622f}
.ladder li:nth-child(5){border-left-color:#b04a2c}
.ladder li:nth-child(6){border-left-color:var(--red)}
table{border-collapse:collapse;width:100%;font-size:16px;margin:6px 0 10px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font-family:var(--head);font-weight:500;color:var(--muted)}
.tablewrap{overflow-x:auto}

.results-head{font-family:var(--head);font-size:22px;margin:0 0 14px}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.from{float:right;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}

/* lecture */
.lecture{max-width:760px}
.lecture .card{margin-bottom:16px}
.lecture .key{background:var(--olive);color:var(--olive-ink);border-radius:6px;padding:14px 18px;margin:12px 0}
.lecture .key b{font-family:var(--head);font-weight:500;letter-spacing:.03em}
.toc{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.toc a{text-decoration:none;border:1.5px solid var(--olive);border-radius:999px;padding:5px 12px;font-size:15px}
.toc a:hover{background:var(--olive);color:var(--olive-ink)}

.cat-h{font-size:26px;margin:30px 0 12px;padding-bottom:6px;border-bottom:3px solid var(--brass);display:flex;align-items:baseline;gap:10px}
.cat-h small{font-family:var(--body);font-size:14px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 9px}
.card p.measures{border-left:4px solid var(--brass);padding:4px 12px;background:var(--bg);border-radius:0 4px 4px 0;font-weight:700}
.card p.note{border-left:4px solid var(--olive);padding:4px 12px;color:var(--muted);font-style:italic}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0 0 18px}
.doc{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:6px;padding:12px 14px;border-left:8px solid var(--line)}
.doc strong{display:block;font-family:var(--head);font-weight:600;font-size:19px;line-height:1.2;letter-spacing:.02em}
.doc span{display:block;margin-top:4px;font-size:14px;color:var(--muted)}
.doc[aria-pressed="true"]{background:var(--olive);color:var(--olive-ink);border-color:var(--olive);border-left-color:var(--brass)}
.doc[aria-pressed="true"] span{color:var(--olive-ink);opacity:.85}
.poster-wrap{display:grid;grid-template-columns:minmax(0,380px) 1fr;gap:22px;align-items:start}
.poster-img{width:100%;height:auto;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;display:block}
.poster-text p{margin:0 0 10px}
.card.basis{border-left:8px solid var(--brass);background:color-mix(in srgb,var(--brass) 7%,var(--surface))}
.card.basis li{margin:6px 0}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px}
@media (max-width:700px){.poster-wrap{grid-template-columns:1fr}}
/* quiz */
.quiz{max-width:760px}
.qbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px;font-family:var(--head);font-size:18px;color:var(--muted)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:var(--brass);width:0;transition:width .25s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px}
.qcard h2{font-size:24px;margin-bottom:16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg)}
.opt:hover:not(:disabled){border-color:var(--olive)}
.opt .l{font-family:var(--head);color:var(--muted);min-width:1.2em}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 16%,transparent)}
.opt:disabled{cursor:default}
.why{margin-top:14px;padding:12px 14px;border-left:5px solid var(--brass);background:var(--bg);border-radius:0 6px 6px 0}
.btn{border:0;background:var(--olive);color:var(--olive-ink);padding:11px 20px;border-radius:6px;font-family:var(--head);font-size:18px;letter-spacing:.03em}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--olive)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.score{font-family:var(--head);font-size:56px;line-height:1;margin:4px 0 8px}
.mistakes{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.mistakes li{background:var(--bg);border-left:5px solid var(--red);padding:10px 14px;border-radius:0 6px 6px 0}
.mistakes small{display:block;color:var(--muted)}
.setup .card{margin-bottom:12px}

@media (max-width:760px){.grid{column-count:1}}
@media (max-width:560px){
  body{font-size:16px}
  .brand h1{font-size:22px}
  .search kbd{display:none}
  .phrase strong{font-size:22px}
  .from{float:none;display:inline-block;margin-bottom:6px}
}
@media (prefers-reduced-motion: reduce){.progress i{transition:none}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Памятка военнослужащего</h1>
      <small>Субординация · Строй · Дисциплина</small>
    </div>
    <label class="search">
      <span aria-hidden="true">🔎</span>
      <input id="q" type="search" placeholder="Поиск: «разрешите», «строй», «выговор», «ст. 23»…" autocomplete="off" aria-label="Поиск по памятке и лекции">
      <kbd>/</kbd>
      <button id="clr" type="button" aria-label="Очистить поиск">×</button>
    </label>
    <div class="tabs" role="tablist" aria-label="Разделы">
      <button class="tab" role="tab" id="t-memo" aria-selected="true" aria-controls="p-memo">Памятка</button>
      <button class="tab" role="tab" id="t-ustav" aria-selected="false" aria-controls="p-ustav">Устав</button>
      <button class="tab" role="tab" id="t-lec" aria-selected="false" aria-controls="p-lec">Лекция по НПА</button>
      <button class="tab" role="tab" id="t-exam" aria-selected="false" aria-controls="p-exam">Экзамен</button>
    </div>
  </div>
</header>

<main>
  <section id="p-search" class="panel" hidden aria-live="polite"></section>

  <section id="p-memo" class="panel" role="tabpanel" aria-labelledby="t-memo">
    <div class="notice"><b>Что здесь есть:</b> материалы по субординации, воинской дисциплине и строевой подготовке. Это короткая выжимка. Полные тексты Дисциплинарного устава, Устава ВС и Караульно-постового устава лежат во вкладке «Устав», разбитые по категориям.</div>
    <div class="chips" id="chips" role="group" aria-label="Фильтр по теме"></div>
    <div class="grid" id="memo-grid"></div>
  </section>

  <section id="p-ustav" class="panel lecture" role="tabpanel" aria-labelledby="t-ustav" hidden>
    <div class="chips" id="doc-chips" role="group" aria-label="Выбор устава"></div>
    <div id="doc-body"></div>
  </section>

  <section id="p-lec" class="panel lecture" role="tabpanel" aria-labelledby="t-lec" hidden>
    <div class="toc" id="toc"></div>
    <div id="lec-body"></div>
  </section>

  <section id="p-exam" class="panel quiz" role="tabpanel" aria-labelledby="t-exam" hidden>
    <div id="quiz"></div>
  </section>
</main>

var BASIS = {"ДУ": {"title": "Главное запомнить: Дисциплинарный устав", "items": ["Взыскание только за виновное и доказанное нарушение, соразмерное проступку. За один проступок одно взыскание, сомнения толкуются в пользу военнослужащего (ст. 5, 7).", "Шесть мер: беседа, устный выговор (1 активный), переаттестация, строгий выговор (2 активных), понижение, увольнение (ст. 6).", "Выговор отрабатывают за 48 часов. Просрочка: ещё один устный выговор за 48 часов и ещё один за 96. Три активных выговора означают увольнение (ст. 6.1).", "Не отказывайтесь от законного приказа, не оскорбляйте и не угрожайте командиру (ст. 8). Вопрос по приказу, доклад о его незаконности, рапорт и жалоба нарушением не считаются.", "Не оставляйте пост или часть, не пропускайте построения, занятия и медосмотры без уважительной причины (ст. 9, 10, 36). Не спите и не отвлекайтесь на посту (ст. 11).", "Не портите, не теряйте и не присваивайте имущество, оружие и боеприпасы (ст. 13, 14). Не курите в запретных зонах (ст. 12.1). Не появляйтесь на службе пьяным (ст. 15).", "Не унижайте подчинённых, не посылайте их с личными поручениями, не назначайте взыскания самовольно (ст. 23).", "Не используйте служебные полномочия, транспорт и имущество в личных целях (ст. 20, 29).", "Не подделывайте документы и не пишите в рапортах заведомую ложь (ст. 19, 25).", "Жалобу на взыскание рассматривают только ОСБ и ВП. Подача жалобы не проступок, давить на жалующегося нельзя (ст. 7.1)."]}, "КПС": {"title": "Главное запомнить: караульно-постовая служба", "items": ["На пост можно заступить со звания Рядовой. Старший наряда назначается приказом (ст. 19, 25).", "Перед заступлением проверьте оружие и рацию. Приём и сдача поста фиксируются докладом в рацию (ст. 26, 28).", "На КПП нельзя спать, сидеть, прислоняться, читать, писать, петь, есть, пить, курить, пользоваться личной связью, танцевать, без нужды доставать оружие и досылать патрон (ст. 36).", "На любом посту не терять концентрацию, не уходить в телефон, не оставлять оружие без контроля, отвечать на запросы по рации (ст. 29).", "Личный транспорт: въезд и выезд только через КПП №1, только при записи в журнале и подтверждённой цели. Сквозной проезд и остановка у штаба, складов и казарм запрещены (ст. 34–34.5).", "КПП №2 резервно-служебный. ВП и ОСБ проезжают через него беспрепятственно при исполнении (ст. 32).", "Без проверки пропускают до генерал-лейтенанта включительно (знать в лицо). Полковники и выше проходят без увольнительной, но предъявляют удостоверение (ст. 30, 31).", "Выходящий в гражданском или на личном транспорте предъявляет удостоверение и не мешает осмотру багажника. Оружие и боеприпасы сдаются на склад (ст. 30, ВУ 3.4.2).", "Плохо с самочувствием: доклад дежурному или старшему наряда и запрос помощи. На плановый осмотр уходят только после сдачи поста (ст. 26.1).", "Заметили нарушение службы: сообщить дежурному, ВП или ОСБ и командиру (ст. 11). Режимный объект это территория внутри периметра (ст. 37)."]}, "ВУ": {"title": "Главное запомнить: Устав Вооружённых Сил и ФСВНГ", "items": ["Законный приказ исполняют, заведомо незаконный не исполняют и докладывают. Незнание устава не освобождает от ответственности (ст. 1.1, 1.3).", "Рабочий день 11:00–21:30, обед 18:00–19:00, вечерняя поверка в 21:00 (гл. II).", "Основания для увольнения: отсутствие более 48 часов, нахождение в части без формы, самовольное оставление части, грубое нарушение устава, непрохождение КМБ или академии (ст. 1.10).", "Рядовой и ефрейтор покидают часть по увольнительной. С младшего сержанта 60 минут в день и отпуск до 7 дней раз в месяц (ст. 2.6, 2.7).", "Военная форма обязательна. Борода запрещена всем, усы запрещены до звания полковник, новобранцы с бритой головой (ст. 3.1–3.3).", "С оружием обращаться как с заряженным, палец вне спуска. В гражданском оружие и боеприпасы сдают на склад (рядовой–подполковник). Бодикамера обязательна для ВП, ОСБ, КПП, патрулей и при задержании (ст. 3.4–3.5).", "Должность важнее звания при исполнении служебных обязанностей (ст. 4.2).", "Сила только при нападении, угрозе жизни, попытке незаконного проникновения или законном задержании. После: помощь, доклад, камера, рапорт. Гражданским наказание не назначают (ст. 5.3, 5.4).", "Коды: 1 спокойно, 2 подозрительные лица, 3 проникновение или нападение, 4 боевая тревога (ст. 6.2).", "Медицинское освобождение и ограничения обязательны, командир не вправе их отменить (ст. 9.3). На территорию ФСВНГ без разрешения нельзя (ст. 10.3)."]}};

 {id:"subord", topic:"Субординация", title:"Что такое субординация", html:`
  <p><b>Субординация</b> — установленная система подчинения по званию и должности, а также правила уважительного общения между военнослужащими.</p>
  <p>Её соблюдение:</p>
  <ul><li>обеспечивает чёткое выполнение приказов;</li><li>предотвращает хаос и самоуправство;</li><li>поддерживает уважение к званиям и командованию;</li><li>повышает эффективность работы подразделения.</li></ul>`},
 {id:"hier", topic:"Субординация", title:"Иерархия в Армии", html:`
  <p>Каждый военнослужащий обязан:</p>
  <ul><li>знать своё звание и должность;</li><li>знать своего непосредственного руководителя;</li><li>соблюдать установленную иерархию.</li></ul>
  <div class="quote"><b>Основной принцип:</b> приказ старшего по званию или должности обязателен к выполнению, если он не противоречит уставу и правилам сервера.</div>`},
 {id:"address", topic:"Субординация", title:"Обращение по субординации", html:`
  <p>Официальная форма взаимодействия между военнослужащими, основанная на уважении к званию, должности и иерархии. При обращении к старшему по званию нужно использовать его звание и соблюдать уважительную форму.</p>
  <div class="tablewrap"><table>
   <tr><th>Ситуация</th><th>Формулировка</th></tr>
   <tr><td>Согласие</td><td>«Так точно»</td></tr>
   <tr><td>Несогласие</td><td>«Никак нет»</td></tr>
   <tr><td>Получение приказа</td><td>«Есть»</td></tr>
   <tr><td>Обращение</td><td>«Звание, Фамилия, разрешите обратиться»</td></tr>
   <tr><td>Не знаете ответа</td><td>«Не могу знать»</td></tr>
  </table></div>
  <p>Каждый военнослужащий обязан уважительно обращаться к другим сотрудникам <b>независимо от их должности и звания</b>.</p>`},
 {id:"orders", topic:"Приказы", title:"Выполнение приказов", html:`
  <p><b>Приказ</b> — официальное распоряжение командира, руководителя или старшего по званию, обязательное для исполнения подчинёнными.</p>
  <p>Приказ выполняется:</p>
  <ul><li>быстро;</li><li>точно;</li><li>без самовольного изменения поставленной задачи;</li><li>с уточнением, если приказ был непонятен.</li></ul>`},
 {id:"orders-ban", topic:"Приказы", title:"Что запрещается при получении приказов", html:`
  <ul class="ban"><li>игнорировать приказы;</li><li>вступать в спор с командиром;</li><li>самовольно изменять поставленную задачу;</li><li>выполнять распоряжения других командиров без соответствующего разрешения.</li></ul>`},
 {id:"penalty", topic:"Взыскания", title:"Виды взысканий (ДУ, ст. 6 и 6.1)", html:`
  <ul class="ladder">
    <li><b>1</b>беседа (устное предупреждение): малозначительное нарушение, в планшет не вносится</li>
    <li><b>2</b>устный выговор: нарушение средней тяжести, 1 активный выговор</li>
    <li><b>3</b>переаттестация: повторная проверка знаний и соответствия должности</li>
    <li><b>4</b>строгий выговор: грубое или повторное нарушение, 2 активных выговора</li>
    <li><b>5</b>понижение в должности или звании</li>
    <li><b>6</b>увольнение со службы: тяжкие нарушения, грубая повторность или накопление выговоров</li>
  </ul>
  <p><b>Отработка:</b> активный выговор отрабатывают за 48 часов. Не отработал за 48 часов: ещё один устный выговор. За 96 часов: ещё один устный. <b>Три активных выговора = увольнение.</b></p>`},
 {id:"articles", topic:"Взыскания", title:"Ключевые статьи", html:`
  <p><b>Ст. 8 ДУ. Нарушение субординации</b><span class="src">ДУ</span><br>Неисполнение законного приказа, умышленный отказ, действия, мешающие исполнению, нарушение порядка обращения. Оскорбление, угроза, насилие в адрес командира или старшего: грубое нарушение. Меры: устный выговор, строгий выговор или увольнение (при угрозе, насилии, грубой повторности).</p>
  <p><b>Ст. 23 ДУ. Самоуправство и неуставные взаимоотношения</b><span class="src">ДУ</span><br>Принуждение, самовольное применение взысканий, унижение, травля подчинённого. Меры: строгий выговор или увольнение.</p>
  <p><b>Ст. 1.3 ВУ. Исполнение приказов</b><span class="src">ВУ</span><br>Законный приказ исполняется. Заведомо незаконный не исполняется, о нём незамедлительно докладывают начальнику.</p>
  <p><b>Ст. 5.4 ВУ. Применение силы</b><span class="src">ВУ</span><br>Только при нападении, угрозе жизни, попытке незаконного проникновения или законном задержании. После: помощь при необходимости, доклад, камера, рапорт.</p>`},
 {id:"formation", topic:"Строй", title:"Основные понятия строевой подготовки", html:`
  <p><b>Строй</b> — установленное Уставом размещение военнослужащих, подразделений и воинских частей для совместных действий в пешем порядке или на машинах.</p>
  <p><b>Шеренга</b> — строй, в котором военнослужащие размещены один возле другого на одной линии с установленными интервалами.</p>
  <p><b>Колонна</b> — строй, в котором военнослужащие расположены в затылок друг другу, а подразделения или машины — одно за другим на установленных Уставом или командиром дистанциях.</p>`},
 {id:"formation-ban", topic:"Строй", title:"Правила поведения в строю: запрещено", html:`
  <ol class="ban" style="list-style:none;padding-left:0">
   <li style="margin-left:1.6em">пропускать или опаздывать на построение без уважительной причины;</li>
   <li style="margin-left:1.6em">самовольно покидать строй или вставать в уже сформированный строй без разрешения;</li>
   <li style="margin-left:1.6em">выталкивать других военнослужащих из строя;</li>
   <li style="margin-left:1.6em">совершать действия без команды: доставать оружие, снимать или надевать бронежилет, доставать телефон, самовольно менять положение в строю;</li>
   <li style="margin-left:1.6em">разговаривать или издавать посторонние звуки без разрешения старшего в строю;</li>
   <li style="margin-left:1.6em">есть, пить, курить и заниматься другими повседневными делами;</li>
   <li style="margin-left:1.6em">спать во время построения;</li>
   <li style="margin-left:1.6em">совершать любые действия, нарушающие дисциплину и порядок в строю.</li>
  </ol>`},
 {id:"late", topic:"Строй", title:"Опоздали на построение", html:`
  <p>Встать в строй без разрешения нельзя. Обратитесь:</p>
  <div class="quote">«[Звание] [Фамилия], разрешите встать в строй».</div>`},
 {id:"evening", topic:"Строй", title:"Вечернее построение", html:`
  <ul>
   <li><b>Когда:</b> в дни, которые генералитет устанавливает в новостях Армии.</li>
   <li><b>Оповещение:</b> о времени личный состав уведомляют через общую рацию.</li>
   <li><b>Доклад:</b> каждое подразделение докладывает о проделанной за день работе.</li>
   <li><b>Информация:</b> до личного состава доводятся важные сведения, распоряжения и указания командования.</li>
  </ul>`},
 {id:"evening-prep", topic:"Строй", title:"Перед тем как встать в строй на вечернее построение", html:`
  <ol><li>Снять бронежилет.</li><li>Убрать оружие за спину.</li><li>Занять своё место в строю.</li><li>Соблюдать установленную дисциплину.</li></ol>
  <p>Во время построения нельзя пользоваться телефоном, разговаривать без разрешения, спать, самовольно покидать строй и совершать посторонние движения.</p>`},

 {"t": "Устав ВС (ВУ)", "q": "Какое отсутствие в подразделении является основанием для увольнения?", "a": ["Более 48 часов", "Более 12 часов", "Более 24 часов", "Более 7 суток"], "why": "Ст. 1.10 ВУ: отсутствие в подразделении более 48 часов. Подтверждённое лечение или освобождение при уведомлении командования не считается самовольным отсутствием."},

var USTAV = [{"name": "Дисциплинарный устав Вооружённых Сил и ФСВНГ", "url": "https://forum.russia.online/threads/%F0%9F%9B%91distsiplinarnyi-ustav-vooruzhennykh-sil-rossiiskoi-federatsii%F0%9F%9B%91.13878/", "abbr": "ДУ", "cats": [{"title": "Общие положения", "arts": [{"title": "Статья 1. Сфера действия и иерархия норм", "html": "<p>Настоящий Устав устанавливает основы воинской дисциплины, порядок применения дисциплинарных мер и меры поощрения военнослужащих Вооружённых Сил и сотрудников ФСВНГ.</p>", "id": "ду-c0-a0", "num": "1"}, {"title": "Статья 2. Воинская дисциплина", "html": "<p>Воинская дисциплина основывается на сознательном исполнении обязанностей, соблюдении субординации, уважении к службе и достоинству других лиц, бережном отношении к имуществу и готовности действовать в интересах подразделения.</p><p>Военнослужащий обязан соблюдать законодательство и уставы, исполнять законные приказы, поддерживать порядок, не допускать действий, подрывающих безопасность службы или авторитет ведомства.</p>", "id": "ду-c0-a1", "num": "2"}, {"title": "Статья 3. Ответственность командования", "html": "<p>Командир организует службу, поддерживает дисциплину, рассматривает сведения о нарушениях в пределах компетенции и принимает меры, соразмерные тяжести проступка.</p><p>Командиру запрещается унижать подчинённых, применять неуставное физическое или психологическое воздействие, скрывать сведения о серьёзном нарушении либо преследовать военнослужащего за добросовестное обращение.</p>", "id": "ду-c0-a2", "num": "3"}, {"title": "Статья 4. Полномочия Военной полиции и ОСБ", "html": "<p>Военная полиция выявляет нарушения, самостоятельно рассматривает / выносит / решает вопросы по привлечению к ответственности военнослужащих, в том числе по вопросам административной, дисциплинарной, уголовной в соответствие с процессуальным законодательством, обеспечивает порядок на военных объектах и передаёт информацию о нарушениях уполномоченным должностным лицам. Военная полиция действует в рамках законодательства и уставов.</p><p>При выявлении нарушения сотрудником ФСВНГ, включая РВО, Кадровую службу и ОМОН, Военная полиция передаёт материалы и сведения в ОСБ. Самостоятельно дисциплинарные взыскания сотрудникам ФСВНГ Военная полиция не назначает.</p><p>При выявлении нарушения сотрудником ВС, ОСБ передаёт материалы и сведения в военную полицию. Самостоятельно дисциплинарные взыскания сотрудникам ВС ОСБ не назначает.</p><p>ОСБ рассматривает полученную информацию, самостоятельно рассматривает / выносит / решает вопросы по привлечению к ответственности ФСВНГ, в том числе по вопросам административной, дисциплинарной, уголовной в соответствие с процессуальным законодательством, и действует в пределах своей компетенции. Решение о дисциплинарной ответственности принимается уполномоченным должностным лицом после проверки обстоятельств.</p><p>ОСБ работает по нарушениям только внутри подразделений ФСВНГ.</p>", "id": "ду-c0-a3", "num": "4"}], "id": "ду-c0"}, {"title": "Взыскания и порядок их применения", "arts": [{"title": "Статья 5. Принципы дисциплинарной ответственности", "html": "<p>Взыскание применяется за виновное нарушение и должно быть справедливым, соразмерным его характеру, последствиям, роли лица и обстоятельствам совершения.</p><p>При назначении взыскания учитываются признание вины, содействие проверке, повторность, степень опасности нарушения и прежнее отношение военнослужащего к службе.</p><p>За один проступок не может назначаться более одного дисциплинарного взыскания. Дисциплинарное взыскание не заменяет ответственность, установленную законодательством.</p><p>При выборе меры учитываются тяжесть нарушения, последствия, степень вины, повторность и поведение военнослужащего. Взыскание должно быть адекватным и соразмерным проступку. Если статья предусматривает несколько возможных мер, уполномоченное лицо выбирает одну из них с учётом обстоятельств нарушения.</p>", "id": "ду-c1-a0", "num": "5"}, {"title": "Статья 6. Виды дисциплинарных взысканий", "html": "<p>К военнослужащему или сотруднику, признанному виновным в дисциплинарном проступке, в пределах компетенции могут применяться следующие меры:</p><ul><li>беседа (устное предупреждение) — применяется за малозначительное нарушение и не вносится в планшет;</li><li>устный выговор — применяется за нарушение средней тяжести и учитывается в планшете как один активный выговор;</li><li>переаттестация — проводится для повторной проверки знаний и соответствия военнослужащего занимаемой должности;</li><li>строгий выговор — применяется за грубое, повторное либо создавшее угрозу нарушение и учитывается в планшете как два активных выговора;</li><li>понижение в должности или звании — только уполномоченным руководителем в порядке, установленном внутренними актами;</li><li>увольнение со службы — применяется за наиболее тяжкие нарушения, грубую повторность либо накопление активных выговоров; оформляется уполномоченным руководителем после рассмотрения материалов проверки.</li></ul>", "id": "ду-c1-a1", "num": "6"}, {"title": "Статья 6.1. Учёт и отработка активных выговоров", "html": "<p>Устный выговор учитывается в планшете как один активный выговор. Строгий выговор учитывается в планшете как два активных выговора. Беседа в планшет не вносится.</p><p>Военнослужащий обязан отработать активный выговор в течение 48 часов с момента его выдачи в порядке, установленном командованием или руководителем подразделения.</p><p>Если активный выговор не отработан в течение 48 часов, военнослужащему выдаётся дополнительный устный выговор. Если выговор не отработан в течение 96 часов с момента первоначальной выдачи, выдаётся ещё один устный выговор.</p><p>Накопление трёх активных выговоров в планшете влечёт увольнение со службы. Решение об увольнении оформляется уполномоченным руководителем после проверки актуальности выговоров и обстоятельств их выдачи. Отработанный, снятый либо признанный необоснованным выговор не учитывается при подсчёте активных выговоров.</p><p>Если медицинское освобождение объективно препятствует установленной форме отработки выговора, военнослужащему предоставляется возможность отработки способом, совместимым с медицинскими ограничениями.</p><p>При отсутствии доступного совместимого способа течение сроков отработки, включая сроки 48 и 96 часов, приостанавливается на период подтверждённой невозможности отработки. После окончания указанного периода течение оставшегося срока возобновляется.</p><p>Приостановление и возобновление срока фиксируются уполномоченным должностным лицом. За период приостановления дополнительные взыскания за просрочку не применяются.</p>", "id": "ду-c1-a2", "num": "6.1"}, {"title": "Статья 7. Порядок рассмотрения нарушения", "html": "<p>До применения взыскания уполномоченное лицо устанавливает обстоятельства нарушения, проверяет доступные доказательства и, когда это возможно, получает объяснение лица, в отношении которого ведётся проверка.</p><p>Решение о применении взыскания должно содержать существо нарушения, конкретную нарушенную норму, установленные обстоятельства, вид взыскания и должностное лицо, его применившее.</p><p>Лицо, в отношении которого применено взыскание, вправе обжаловать решение в установленном настоящим Уставом порядке.</p><p>Неустранимые сомнения в обстоятельствах проступка толкуются в пользу военнослужащего или сотрудника.</p>", "id": "ду-c1-a3", "num": "7"}, {"title": "Статья 7.1. Основания дисциплинарной ответственности (обжалование)", "html": "<p>Рассмотрение обжалования наказаний на дисциплинарные взыскания осуществляется исключительно ОСБ и ВП. Командир или иное должностное лицо, применившее дисциплинарное взыскание, не вправе самостоятельно рассматривать жалобу на собственное решение. ОСБ и ВП при рассмотрении жалобы вправе проверить:</p><ul><li>наличие факта нарушения;</li><li>соответствие действий лица конкретной норме Устава;</li><li>наличие и достаточность имеющихся доказательств;</li><li>соблюдение порядка применения взыскания;</li><li>соответствие применённого взыскания установленным обстоятельствам.</li></ul><p>По результатам рассмотрения жалобы ОСБ или ВП вправе оставить взыскание в силе, изменить его либо отменить при установлении необоснованности или нарушения порядка его применения. Подача жалобы не является дисциплинарным проступком и не может сама по себе являться основанием для применения нового взыскания. Запрещается препятствовать подаче жалобы, требовать её отзыва либо оказывать давление на лицо в связи с обращением в ОСБ или ВП.</p><p class=\"note\">Примечание: Снятие, отмена либо изменение дисциплинарного взыскания без достаточных оснований, в том числе по личной договорённости, знакомству или иной личной заинтересованности («по блату»), запрещается.</p><p>Должностное лицо ОСБ или ВП, необоснованно снявшее либо изменившее дисциплинарное взыскание, подлежит дисциплинарной ответственности в соответствии с настоящим Уставом.</p>", "id": "ду-c1-a4", "num": "7.1"}], "id": "ду-c1"}, {"title": "Проступки: субординация и несение службы", "arts": [{"title": "Статья 8. Нарушение субординации", "html": "<p>Неисполнение законного приказа, умышленный отказ от исполнения законного распоряжения, действия, препятствующие исполнению законного приказа, а также нарушение установленного порядка обращения между военнослужащими являются нарушением субординации.</p><p>Не является нарушением субординации обращение за разъяснением приказа, доклад о невозможности его исполнения, сообщение о незаконности приказа, подача рапорта или жалобы в установленном порядке.</p><p>Оскорбление, угроза, применение насилия либо иное грубое воздействие в отношении командира, старшего по должности или другого военнослужащего рассматриваются как грубое нарушение субординации.</p><p class=\"measures\">Возможные меры: устный выговор, строгий выговор или увольнение при угрозе, насилии либо грубой повторности.</p>", "id": "ду-c2-a0", "num": "8"}, {"title": "Статья 9. Самовольное оставление места службы", "html": "<p>Самовольное оставление части, подразделения, места несения службы или самовольное прекращение исполнения служебной задачи без уважительной причины является дисциплинарным проступком.</p><p>Тяжесть проступка определяется с учётом продолжительности отсутствия, последствий и статуса военнослужащего. Обстоятельства, объективно исключавшие возможность прибыть или продолжить службу, подлежат учёту.</p><p>Подтверждённая невозможность продолжения службы по состоянию здоровья, экстренное обращение за медицинской помощью или эвакуация подлежат обязательному учёту при рассмотрении обстоятельств отсутствия.</p><p>Невозможность своевременно доложить о состоянии здоровья сама по себе не образует нарушение, если она была объективно обусловлена состоянием военнослужащего. При первой возможности военнослужащий либо медицинский работник уведомляет командование.</p><p class=\"measures\">Возможные меры: устный выговор, строгий выговор или увольнение при оставлении поста, существенных последствиях либо повторном нарушении.</p>", "id": "ду-c2-a1", "num": "9"}, {"title": "Статья 10. Уклонение от службы и обязательных мероприятий", "html": "<p>Неявка без уважительной причины на обязательное построение, занятие, медицинский осмотр, инструктаж, служебное мероприятие или иной обязательный формат службы является дисциплинарным проступком.</p><p>Уклонением от службы также является намеренное прекращение уже принятого военнослужащим наряда, патруля либо иной служебной задачи без передачи её в установленном порядке.</p><p>Действующее медицинское освобождение является уважительной причиной неисполнения тех обязанностей и неявки на те мероприятия, на которые распространяются установленные ограничения.</p><p>Ответственность за неявку на медицинский осмотр применяется при условии, что осмотр назначен уполномоченным лицом, требование доведено до военнослужащего и у него имелась возможность явиться.</p><p>Несение постовой службы до прибытия смены, получение экстренной помощи и иные подтверждённые обстоятельства, объективно препятствующие явке, учитываются при установлении вины.</p><p class=\"measures\">Возможные меры: беседа, устный выговор, строгий выговор; при грубой повторности или срыве служебной задачи — увольнение.</p>", "id": "ду-c2-a2", "num": "10"}, {"title": "Статья 11. Нарушение порядка несения службы", "html": "<p>Ненадлежащее несение караульной, патрульной, внутренней или иной служебной обязанности, если оно создало или могло создать угрозу безопасности, порядку или имуществу, является дисциплинарным проступком.</p><p>К ненадлежащему несению службы относятся, в частности:</p><ul><li>сон во время исполнения служебной обязанности;</li><li>оставление поста, маршрута или места несения службы без установленного разрешения;</li><li>необоснованное прекращение патрулирования либо иной служебной задачи;</li><li>игнорирование обязательной служебной связи;</li><li>несвоевременная передача службы;</li><li>отсутствие необходимого наблюдения за охраняемой территорией, объектом либо лицами;</li><li>совершение действий, не связанных с исполнением службы, если они препятствуют выполнению служебной обязанности;</li><li>иное бездействие или действие, нарушающее установленный порядок несения службы.</li></ul><p>Самостоятельное заступление на пост или патруль допускается в рамках действующих уставов. Отсутствие индивидуального назначения либо журнала поста не освобождает лицо от ответственности за нарушение фактически принятой им службы.</p><p class=\"measures\">Возможные меры: беседа, устный выговор или строгий выговор; при создании угрозы безопасности, существенном вреде либо грубой повторности — увольнение.</p>", "id": "ду-c2-a3", "num": "11"}, {"title": "Статья 21. Поведение в строю и на территории части", "html": "<p>Военнослужащий обязан соблюдать установленный порядок на построениях, плацу, в казармах и на территории части, не мешать проведению служебных мероприятий и не создавать опасность другим лицам.</p><p>Нарушением порядка на построении является умышленное действие или бездействие, препятствующее проведению построения, выполнению команд, размещению личного состава либо обеспечению безопасности.</p><p>Самовольное передвижение бегом по плацу во время проведения построения при наличии сформированного строя запрещается. Исключение составляют случаи исполнения команды или распоряжения командования, необходимости оказания помощи либо обеспечения безопасности.</p><p>Случайное перемещение, выполнение служебного распоряжения либо иное действие, объективно необходимое для выполнения службы, не является нарушением настоящей статьи.</p><p class=\"measures\">Возможные меры: беседа, устный выговор или строгий выговор при повторном нарушении, срыве мероприятия либо создании опасности.</p>", "id": "ду-c2-a4", "num": "21"}, {"title": "Статья 27. Халатность", "html": "<p>Неисполнение либо ненадлежащее исполнение обязанностей вследствие недобросовестного отношения к службе, если это повлекло или могло повлечь вред безопасности, порядку, имуществу или интересам службы, является дисциплинарным проступком.</p><p>Ошибка, допущенная при добросовестном исполнении обязанности, сама по себе не является халатностью.</p><p>Для установления халатности необходимо установить конкретную обязанность лица, способ её нарушения, фактическую возможность надлежащего исполнения, вину и причинную связь между нарушением и наступившими либо возможными последствиями.</p><p>При оценке исполнения медицинских обязанностей учитываются подготовка работника, предоставленные полномочия, доступность необходимых средств и фактическая возможность оказать помощь.</p><p>Неблагоприятный результат оказания помощи сам по себе не доказывает халатность.</p><p>Неисполнение командиром доведённых до него действующих медицинских ограничений при наличии возможности обеспечить их соблюдение оценивается по настоящей статье либо иной применимой специальной норме с учётом характера вины и последствий.</p><p class=\"measures\">Возможные меры: беседа, устный выговор, строгий выговор или увольнение в зависимости от возможного либо наступившего вреда.</p>", "id": "ду-c2-a5", "num": "27"}], "id": "ду-c2"}, {"title": "Проступки: порядок, безопасность, имущество и оружие", "arts": [{"title": "Статья 12. Нарушение порядка и общественной безопасности", "html": "<p>Действия или бездействие военнослужащего, нарушающие общественный порядок, безопасность военного объекта, установленный режим либо создающие угрозу гражданам, военнослужащим или имуществу, являются дисциплинарным проступком.</p><p class=\"measures\">Возможные меры: беседа, устный выговор или строгий выговор; при серьёзной угрозе безопасности, значимых последствиях либо грубой повторности — увольнение.</p>", "id": "ду-c3-a0", "num": "12"}, {"title": "Статья 12.1. Нарушение требований пожарной безопасности", "html": "<p>Нарушение требований пожарной безопасности, неосторожное обращение с огнём, создание пожароопасной ситуации, использование источников огня в запрещённой зоне либо игнорирование требований безопасности на складе, в казарме, гараже, технике или ином объекте Армии является дисциплинарным проступком.</p><p>За нарушение может применяться беседа, устный выговор или строгий выговор. Если нарушение создало реальную угрозу жизни, повлекло ущерб имуществу либо совершено повторно, применяется строгий выговор или увольнение.</p><p>Курение, использование электронных устройств для курения, кальянов и иных аналогичных средств в помещениях, на посту, на складе, вблизи техники, вооружения, горюче-смазочных материалов либо в иной запрещённой зоне является нарушением требований пожарной безопасности.</p><p class=\"measures\">Возможные меры: беседа, устный выговор или строгий выговор; при реальной угрозе жизни, ущербе имуществу либо повторном нарушении — строгий выговор или увольнение.</p>", "id": "ду-c3-a1", "num": "12.1"}, {"title": "Статья 13. Повреждение, утрата и незаконное использование имущества", "html": "<p>Умышленные либо небрежные действия, повлекшие утрату, порчу, повреждение или неправомерное использование государственного, ведомственного либо чужого имущества, являются дисциплинарным проступком.</p><p>Сам факт отсутствия имущества не является достаточным основанием для признания военнослужащего виновным в его утрате.</p><p>При наличии нескольких лиц, ответственных за имущество, ответственность каждого определяется индивидуально с учётом его фактических обязанностей и действий.</p><p>Нарушение, содержащее признаки преступления или административного правонарушения, передаётся для рассмотрения в порядке, установленном законодательством.</p><p>Хищение, присвоение, незаконное удержание либо передача государственного, ведомственного или чужого имущества без законных оснований является грубым дисциплинарным проступком.</p><p>Положения настоящей статьи распространяются на медицинские препараты, медицинское имущество и расходные материалы.</p><p>Нарушение порядка учёта без установленных фактов утраты, присвоения, незаконной передачи или использования имущества не признаётся автоматически хищением либо утратой и оценивается по фактическим обстоятельствам.</p><p class=\"measures\">Возможные меры: устный выговор, строгий выговор или увольнение в зависимости от характера вины, стоимости имущества и наступивших последствий.</p>", "id": "ду-c3-a2", "num": "13"}, {"title": "Статья 14. Оружие, боеприпасы и специальные средства", "html": "<p>Нарушение правил хранения, учёта, переноски, передачи или применения оружия, боеприпасов и специальных средств является дисциплинарным проступком.</p><p>Утеря, порча, оставление без присмотра либо небрежное хранение указанных предметов рассматриваются с учётом создаваемой опасности и наступивших последствий.</p><p class=\"measures\">Возможные меры: устный выговор, строгий выговор или увольнение в зависимости от опасности нарушения, последствий и повторности.</p>", "id": "ду-c3-a3", "num": "14"}, {"title": "Статья 15. Состояние опьянения и запрещённые вещества", "html": "<p>Появление на службе в состоянии алкогольного, наркотического или иного опьянения, употребление запрещённых веществ во время службы, а равно необоснованный отказ от освидетельствования в случаях, предусмотренных законодательством, являются дисциплинарными проступками.</p><p class=\"measures\">Возможные меры: строгий выговор или увольнение. При наличии признаков нарушения законодательства материалы передаются уполномоченному органу.</p>", "id": "ду-c3-a4", "num": "15"}, {"title": "Статья 17. Военная форма и внешний вид", "html": "<p>Нарушение правил ношения военной формы, знаков различия, средств индивидуальной защиты и иных обязательных элементов внешнего вида является дисциплинарным проступком, если оно не обусловлено служебной необходимостью.</p><p>Требования к форме, причёске, растительности на лице, средствам индивидуальной защиты и гигиене устанавливаются общим уставом и обязательны в пределах, прямо предусмотренных таким уставом.</p><p>Вынужденное изменение формы или внешнего вида, вызванное выполнением служебной задачи, чрезвычайной ситуацией, необходимостью обеспечения безопасности либо иными объективными обстоятельствами, не является нарушением.</p><p>Требования к внешнему виду должны быть доведены до военнослужащих до начала их применения.</p><p class=\"measures\">Возможные меры: беседа, устный выговор или строгий выговор при повторном либо демонстративном нарушении.</p>", "id": "ду-c3-a5", "num": "17"}, {"title": "Статья 22. Символика, ритуалы и азартные игры", "html": "<p>Надругательство над государственными или ведомственными символами, срыв установленного воинского ритуала, а также организация или участие в азартных играх в служебное время либо на служебной территории являются дисциплинарными проступками.</p><p class=\"measures\">Возможные меры: устный выговор, строгий выговор или увольнение при грубом, публичном либо повторном нарушении.</p>", "id": "ду-c3-a6", "num": "22"}, {"title": "Статья 29. Режим объекта, связь и транспорт", "html": "<p>Ведение отдельного журнала поста или назначение военнослужащего на пост не являются признанием нарушения. Значимые инциденты фиксируются служебным сообщением, рапортом либо иным установленным способом.</p><p>Использование личного транспорта на территории воинской части допускается только по маршрутам и через пункты пропуска, прямо определённые действующим караульным уставом или распоряжением командования.</p><p>Личный транспорт, въезжающий на территорию части, должен быть зарегистрирован в реестре личных Т/С.</p><p>Служебный транспорт используется исключительно для выполнения служебных задач. Запрещается использовать служебный автомобиль для личных поездок, развлечений или иных целей, не связанных с исполнением служебных обязанностей.</p><p>Запрещается использовать служебный автомобиль для перевозки личных вещей, имущества или иных лиц, если такая перевозка не связана с выполнением служебной задачи либо не разрешена уполномоченным должностным лицом.</p><p>Запрещается передавать служебный автомобиль другому лицу без служебной необходимости и разрешения уполномоченного должностного лица.</p><p>Использование служебного транспорта для личных целей допускается только в случае, если такое использование непосредственно связано с выполнением служебной задачи либо отдельно разрешено уполномоченным должностным лицом.</p><p>При возникновении необходимости использования служебного транспорта вне установленного назначения военнослужащий обязан получить соответствующее разрешение до начала поездки, за исключением чрезвычайной ситуации, когда получение разрешения объективно невозможно.</p><p class=\"measures\">Возможные меры: беседа, устный выговор или строгий выговор; при создании угрозы безопасности, существенных последствиях либо грубой повторности — увольнение.</p>", "id": "ду-c3-a7", "num": "29"}], "id": "ду-c3"}, {"title": "Проступки: информация, власть и этика", "arts": [{"title": "Статья 16. Бездействие командира и незаконное привлечение к ответственности", "html": "<p>Умышленное бездействие командира при наличии сведений о существенном нарушении, сокрытие такого нарушения или воспрепятствование его проверке является дисциплинарным проступком.</p><p>Привлечение военнослужащего к ответственности без установленных оснований, вне предоставленной компетенции либо с нарушением установленного порядка также является дисциплинарным проступком.</p><p>Ответственность за бездействие наступает при одновременном наличии:</p><ul><li>фактической информации о нарушении;</li><li>обязанности принять соответствующие меры;</li><li>реальной возможности принять такие меры;</li><li>умышленного либо недобросовестного бездействия.</li></ul><p>Отсутствие информации о нарушении, объективная невозможность получить такую информацию либо отсутствие фактической возможности принять необходимые меры сами по себе не образуют нарушение.</p><p class=\"measures\">Возможные меры: строгий выговор или увольнение. При наличии признаков нарушения законодательства материалы передаются уполномоченному органу.</p>", "id": "ду-c4-a0", "num": "16"}, {"title": "Статья 18. Честь ведомства и дискредитация", "html": "<p>Публичные умышленные действия, высказывания или распространение материалов, содержащих заведомо ложные сведения о Вооружённых Силах, ФСВНГ, их деятельности или символике, совершённые с целью причинения вреда авторитету ведомства, являются дисциплинарным проступком.</p><p>Критика деятельности ведомства, выражение мнения, обращение с жалобой, рапортом или сообщением о нарушении не образуют дисциплинарного проступка сами по себе.</p><p>Добросовестное сообщение о возможном нарушении не признаётся дискредитацией независимо от того, подтвердились ли указанные в сообщении обстоятельства.</p><p class=\"measures\">Возможные меры: устный выговор, строгий выговор или увольнение при грубом, публичном либо повторном нарушении.</p>", "id": "ду-c4-a1", "num": "18"}, {"title": "Статья 19. Служебная информация и документы", "html": "<p>Разглашение охраняемой служебной информации, несанкционированный доступ к ней, подделка, уничтожение или неправомерное использование служебных документов являются дисциплинарными проступками.</p><p>Предоставление заведомо ложных сведений в рапорте, объяснении, отчёте или ином служебном документе рассматривается как самостоятельный проступок.</p><p>К служебным документам относятся приказы и приказания, директивы, рапорты и доклады, акты и протоколы, справки и удостоверения, медицинские карточки, заключения, направления и документы учёта медицинских препаратов и имущества.</p><p>Подделка таких документов, оформление фиктивного осмотра или освобождения, внесение заведомо ложных сведений, несанкционированное изменение записей либо разглашение охраняемых медицинских сведений рассматриваются по настоящей статье.</p><p>Добросовестная техническая ошибка, исправленная в установленном порядке, сама по себе не признаётся подделкой или предоставлением заведомо ложных сведений.</p><p class=\"measures\">Возможные меры: устный выговор, строгий выговор или увольнение в зависимости от характера информации, последствий и повторности.</p>", "id": "ду-c4-a2", "num": "19"}, {"title": "Статья 20. Злоупотребление полномочиями и конфликт интересов", "html": "<p>Использование служебных полномочий, имущества, доступа, транспорта либо специального статуса в личных интересах, а также принятие решения при неурегулированном конфликте интересов являются дисциплинарными проступками.</p><p>Служебные полномочия не могут использоваться для личной выгоды, давления на граждан или военнослужащих либо обхода установленной процедуры.</p><p>Использование служебного транспорта, имущества или оборудования в личных целях запрещается, если такое использование не связано непосредственно с выполнением служебной задачи либо не разрешено уполномоченным должностным лицом.</p><p>Использование медицинского осмотра, заключения, освобождения или направления на обследование для личной выгоды, давления, мести либо вмешательства в кадровые решения вне предоставленных полномочий является злоупотреблением.</p><p>При возникновении обстоятельств, способных повлиять на объективность принимаемого решения, военнослужащий обязан сообщить об этом непосредственному командиру либо иному уполномоченному лицу.</p><p>Медицинское освобождение не допускается использовать в качестве дисциплинарного наказания.</p><p class=\"measures\">Возможные меры: строгий выговор или увольнение. При наличии признаков нарушения законодательства материалы передаются уполномоченному органу.</p>", "id": "ду-c4-a3", "num": "20"}, {"title": "Статья 23. Самоуправство и неуставные взаимоотношения", "html": "<p>Принуждение военнослужащего к действиям, не предусмотренным законодательством, уставом или законным приказом, самовольное применение взысканий, а равно унижение, травля или неуставное воздействие на подчинённого являются дисциплинарными проступками.</p><p>К неуставным взаимоотношениям также относятся: использование подчинённого для выполнения личных поручений; требование передать имущество или денежные средства; угрозы, запугивание или систематическое давление; публичное унижение военнослужащего; принуждение к действиям, не связанным со службой; применение физического воздействия вне предусмотренных случаев; самовольное установление дополнительных обязанностей или ограничений; использование служебного положения для разрешения личного конфликта.</p><p class=\"measures\">Возможные меры: строгий выговор или увольнение. При наличии признаков нарушения законодательства материалы передаются уполномоченному органу.</p>", "id": "ду-c4-a4", "num": "23"}, {"title": "Статья 24. Оказание помощи", "html": "<p>Неоказание посильной помощи раненому, пострадавшему, военнослужащему, гражданину либо сотруднику, находящемуся в опасном состоянии, когда помощь могла быть оказана без неоправданного риска, является дисциплинарным проступком.</p><p class=\"measures\">Возможные меры: устный выговор, строгий выговор или увольнение в зависимости от опасности ситуации и последствий неоказания помощи.</p>", "id": "ду-c4-a5", "num": "24"}, {"title": "Статья 25. Заведомо ложное сообщение и клевета", "html": "<p>Заведомо ложное сообщение о нарушении, преступлении или происшествии, а равно распространение заведомо недостоверных сведений, порочащих честь и достоинство другого лица, является дисциплинарным проступком.</p><p>Сообщение не признаётся заведомо ложным только на основании того, что указанные в нём сведения впоследствии не подтвердились.</p><p>Для признания сообщения заведомо ложным необходимо установить, что лицо на момент сообщения знало о недостоверности сообщаемых сведений либо сознательно сообщило их вопреки известным ему обстоятельствам.</p><p>Добросовестная жалоба, рапорт, доклад или сообщение о предполагаемом нарушении не является заведомо ложным сообщением, если лицо не знало о недостоверности указанных сведений.</p><p class=\"measures\">Возможные меры: устный выговор, строгий выговор или увольнение при тяжких последствиях, грубой клевете либо повторном нарушении.</p>", "id": "ду-c4-a6", "num": "25"}, {"title": "Статья 26. Воспрепятствование законной деятельности", "html": "<p>Неповиновение законным требованиям уполномоченного сотрудника, создание препятствий проверке, служебному мероприятию либо законной деятельности государственного органа является дисциплинарным проступком.</p><p class=\"measures\">Возможные меры: устный выговор, строгий выговор или увольнение при умышленном срыве законной деятельности, угрозе либо грубой повторности.</p>", "id": "ду-c4-a7", "num": "26"}, {"title": "Статья 28. Связи с преступной деятельностью", "html": "<p>Сокрытие достоверно известных сведений о подготовке либо совершении преступления, а также использование служебного положения в интересах преступной деятельности является дисциплинарным проступком и подлежит передаче для рассмотрения по законодательству.</p><p class=\"measures\">Возможные меры: строгий выговор или увольнение. Материалы подлежат передаче для рассмотрения по законодательству.</p>", "id": "ду-c4-a8", "num": "28"}, {"title": "Статья 30. Иные нарушения", "html": "<p>Нарушение обязанностей, прямо установленных законодательством, настоящим Уставом, иными уставами или законным приказом, может являться дисциплинарным проступком при наличии вины и доказанных обстоятельств.</p><p>Общая формулировка настоящей статьи не применяется для обхода специальных норм Устава или назначения взыскания за поведение, которое не было заранее запрещено либо не нарушило конкретную законную обязанность.</p><p>При наличии специальной нормы настоящего Устава применяется специальная норма, а статья 30 не используется вместо неё.</p><p>Лицо не может быть привлечено к дисциплинарной ответственности исключительно на основании настоящей статьи, если невозможно указать конкретную… (в присланном тексте статья обрывается на этом месте)</p>", "id": "ду-c4-a9", "num": "30"}], "id": "ду-c4"}, {"title": "Поощрения", "arts": [{"title": "Статья 31. Основания для поощрения", "html": "<p>Поощрение применяется за добросовестную службу, инициативу, образцовое исполнение обязанностей, успешное выполнение сложной задачи, помощь подразделению, дисциплинированность и иные заслуги перед ведомством.</p>", "id": "ду-c5-a0", "num": "31"}, {"title": "Статья 32. Виды поощрений", "html": "<p>В пределах компетенции могут применяться следующие меры поощрения:</p><ul><li>снятие ранее наложенного дисциплинарного взыскания;</li><li>объявление благодарности;</li><li>награждение ценным подарком либо денежной премией в порядке, установленном проектом;</li><li>досрочное присвоение очередного звания или представление к повышению;</li><li>занесение в книгу почёта либо иную форму публичного признания заслуг.</li></ul>", "id": "ду-c5-a1", "num": "32"}, {"title": "Статья 33. Порядок применения поощрений", "html": "<p>Поощрение объявляется уполномоченным должностным лицом и должно быть обосновано конкретными заслугами военнослужащего или сотрудника. Поощрение не освобождает от ответственности за совершённые нарушения.</p>", "id": "ду-c5-a2", "num": "33"}], "id": "ду-c5"}, {"title": "Заключительные положения", "arts": [{"title": "Статья 34. Применение Устава", "html": "<p>Настоящий Устав применяется совместно с общим уставом Вооружённых Сил, уставом караульно-постовой службы и действующим законодательством проекта.</p><p>Положения Устава подлежат периодическому пересмотру командованием при изменении законодательства, структуры ведомств или игровых механик. Изменения не могут ухудшать положение лица задним числом.</p>", "id": "ду-c6-a0", "num": "34"}, {"title": "Статья 35. Толкование", "html": "<p>Официальное толкование положений настоящего Устава осуществляется уполномоченным руководством проекта в соответствии с законодательством. При наличии пробела применяется наиболее близкая по смыслу норма с соблюдением принципов справедливости, соразмерности и презумпции добросовестности.</p>", "id": "ду-c6-a1", "num": "35"}], "id": "ду-c6"}, {"title": "Медицинские проверки и ответственность", "arts": [{"title": "Статья 36. Обязательность медицинских проверок", "html": "<p>Военнослужащие обязаны своевременно проходить проверки, назначенные Медицинской ротой, в установленное руководством время.</p><p>Неявка либо пропуск обязательной проверки без уважительной причины является дисциплинарным нарушением.</p>", "id": "ду-c7-a0", "num": "36"}, {"title": "Статья 37. Рекомендации Медицинской роты", "html": "<p>По результатам проверки сотрудники Медицинской роты вправе выдавать военнослужащему рекомендации, связанные с дальнейшим прохождением службы и устранением выявленных нарушений.</p><p>Военнослужащий обязан ознакомиться с выданными ему рекомендациями и выполнить обязательные требования в установленный срок.</p>", "id": "ду-c7-a1", "num": "37"}, {"title": "Статья 38. Игнорирование рекомендаций", "html": "<p>Систематическое либо намеренное игнорирование рекомендаций Медицинской роты рассматривается как нарушение служебной дисциплины.</p><p>При повторном игнорировании рекомендаций или отказе от выполнения обязательных требований к военнослужащему может быть применено дисциплинарное взыскание.</p>", "id": "ду-c7-a2", "num": "38"}, {"title": "Статья 39. Ответственность за пропуск проверки", "html": "<p>За пропуск обязательной проверки Медицинской роты без уважительной причины к военнослужащему применяется дисциплинарное взыскание в соответствии с настоящим Уставом.</p>", "id": "ду-c7-a3", "num": "39"}, {"title": "Статья 40. Уважительные причины", "html": "<p>Уважительными причинами пропуска проверки могут являться служебная необходимость, отсутствие военнослужащего по согласованной причине либо иные обстоятельства, признанные руководством уважительными.</p><p class=\"note\">Примечание: о невозможности пройти проверку военнослужащий обязан заранее уведомить сотрудника Медицинской роты либо непосредственное руководство.</p>", "id": "ду-c7-a4", "num": "40"}], "id": "ду-c7"}]}, {"name": "Устав Вооружённых Сил и ФСВНГ", "url": "https://forum.russia.online/threads/%F0%9F%9B%91ustav-vooruzhennykh-sil-i-federal-naya-sluzhba-voisk-natsional-noi-gvardii%F0%9F%9B%91.13872/", "abbr": "ВУ", "cats": [{"title": "Глава I. Общие положения", "arts": [{"title": "Преамбула", "html": "<p>Настоящий Устав определяет права и обязанности военнослужащих Вооружённых Сил и Федеральной службы войск национальной гвардии, порядок взаимодействия, обязанности должностных лиц и правила внутреннего порядка. Все военнослужащие независимо от звания и должности обязаны руководствоваться настоящим Уставом.</p>", "id": "ву-c0-a0", "num": ""}, {"title": "Статья 1.1. Соблюдение Устава", "html": "<p>Каждый военнослужащий обязан знать и соблюдать положения настоящего Устава. Незнание Устава не освобождает от ответственности.</p>", "id": "ву-c0-a1", "num": "1.1"}, {"title": "Статья 1.2. Воинский долг", "html": "<p>Каждый военнослужащий обязан честно и качественно исполнять воинский долг, защищать национальные интересы, суверенитет и целостность территории Российской Федерации.</p>", "id": "ву-c0-a2", "num": "1.2"}, {"title": "Статья 1.3. Исполнение приказов", "html": "<p>Военнослужащий обязан исполнить законный приказ начальника. При получении заведомо незаконного приказа военнослужащий не исполняет его и незамедлительно докладывает непосредственному либо вышестоящему начальнику.</p>", "id": "ву-c0-a3", "num": "1.3"}, {"title": "Статья 1.4. Репутация Армии", "html": "<p>Запрещены действия, способные нанести ущерб репутации Армии или подорвать доверие к ней.</p>", "id": "ву-c0-a4", "num": "1.4"}, {"title": "Статья 1.5. Обращение по служебным вопросам", "html": "<p>При возникновении служебных вопросов военнослужащий обращается к командиру своего подразделения.</p>", "id": "ву-c0-a5", "num": "1.5"}, {"title": "Статья 1.6. Единоначалие", "html": "<p>Командир наделён распорядительной властью и несёт персональную ответственность за подразделение.</p>", "id": "ву-c0-a6", "num": "1.6"}, {"title": "Статья 1.7. Построения", "html": "<p>Во время объявленного построения военнослужащие обязаны явиться в назначенное место точно и в срок, кроме лиц, несущих службу на посту.</p><p>Военнослужащий, имеющий действующее медицинское освобождение от участия в построениях либо ограничения, несовместимые с условиями их проведения, освобождается от участия на срок действия медицинского заключения. О наличии освобождения военнослужащий сообщает непосредственному командиру, а при невозможности сообщить самостоятельно — через военнослужащего медроты.</p>", "id": "ву-c0-a7", "num": "1.7"}, {"title": "Статья 1.8. Набор", "html": "<p>Набор в ряды Армии осуществляется посредством агитационных мероприятий и призывов по утверждённому графику.</p>", "id": "ву-c0-a8", "num": "1.8"}, {"title": "Статья 1.9. КМБ и Военная академия", "html": "<p>Курс молодого бойца проходится не более чем за 5 дней, Военная академия — не более чем за 10 дней. После провала Военной академии военнослужащий заносится в чёрный список на срок от 14 до 90 дней по решению командования.</p>", "id": "ву-c0-a9", "num": "1.9"}, {"title": "Статья 1.10. Основания для увольнения", "html": "<p>Основаниями для увольнения являются: собственное желание; грубое нарушение Устава; нарушение законодательства; решение суда или предписание Прокуратуры; непрохождение КМБ или Военной академии; отсутствие в подразделении более 48 часов; нахождение в части без формы; самовольное оставление части; иные прямо предусмотренные настоящим Уставом основания. Наличие дисциплинарных взысканий влечёт последствия в порядке, установленном Дисциплинарным уставом.</p><p>Отсутствие на службе, обусловленное подтверждённым лечением, госпитализацией или медицинским освобождением, не признаётся самовольным отсутствием при условии уведомления командования. Если своевременное уведомление было невозможно по состоянию здоровья, оно осуществляется при первой возможности.</p><p>Само по себе временное медицинское освобождение не является основанием для увольнения. Кадровые решения по состоянию здоровья принимаются уполномоченным должностным лицом на основании надлежащего медицинского заключения и в порядке, установленном законодательством.</p>", "id": "ву-c0-a10", "num": "1.10"}, {"title": "Статья 1.11. Военная присяга", "html": "<p>Каждый военнослужащий, прибывший в часть и проходящий КМБ или Военную академию, обязан принять Военную присягу. Отказ от её принятия или грубое нарушение присяги является основанием для увольнения.</p>", "id": "ву-c0-a11", "num": "1.11"}, {"title": "Статья 1.12. Сбережение имущества", "html": "<p>Военнослужащий обязан бережно относиться к вооружению, технике, обмундированию и иному государственному имуществу. Запрещены умышленная порча, неаккуратное использование служебного транспорта, утрата или небрежное хранение оружия и спецсредств, использование казённого имущества в личных целях.</p>", "id": "ву-c0-a12", "num": "1.12"}], "id": "ву-c0"}, {"title": "Глава II. Распорядок дня", "arts": [{"title": "Статья 2.1. Служебный день", "html": "<p>Рабочий день для личного состава ВС и ФСВНГ устанавливается ежедневно с 11:00 до 21:30.</p><p class=\"note\">Примечание: командование штаба вправе продлить рабочий день в случае непредвиденных обстоятельств.</p>", "id": "ву-c1-a0", "num": "2.1"}, {"title": "Статья 2.2. Перерыв", "html": "<p>Обеденное время устанавливается ежедневно с 18:00 до 19:00 и предоставляется без оформления увольнительной.</p>", "id": "ву-c1-a1", "num": "2.2"}, {"title": "Статья 2.3. Вызов на службу", "html": "<p>Служебная деятельность не прекращается после завершения рабочего дня. Военнослужащий может быть вызван из отгула, кроме отпуска в мирное время.</p>", "id": "ву-c1-a2", "num": "2.3"}, {"title": "Статья 2.4. Вечерняя поверка", "html": "<p>Ежедневно в 21:00 проводится вечерняя поверка. Во время вечерней проверки постовые не покидают пост. Их присутствие подтверждается докладом по рации, через начальника караула либо после смены поста.</p>", "id": "ву-c1-a3", "num": "2.4"}, {"title": "Статья 2.5. Изменение графика", "html": "<p>Командир части вправе временно корректировать график приказом.</p>", "id": "ву-c1-a4", "num": "2.5"}, {"title": "Статья 2.6. Увольнительное время и выход из части", "html": "<p>Рядовой и ефрейтор могут покидать часть только по увольнительной, при наличии необходимых и непереносимых для увольнительной причин. Начиная со звания младший сержант, военнослужащий вправе запросить и получить увольнительное время продолжительностью 60 минут в день (можно разбить на два промежутка длительностью 30 минут).</p><p>Младший сержант и выше могут покидать часть после окончания службы при отсутствии ограничений, наряда, тревоги или дисциплинарного запрета.</p>", "id": "ву-c1-a5", "num": "2.6"}, {"title": "Статья 2.7. Отпуск", "html": "<p>Младший сержант и выше имеют право на отпуск до 7 дней раз в месяц. По семейным обстоятельствам отпуск может быть предоставлен в ином объёме по решению вышестоящего командования.</p>", "id": "ву-c1-a6", "num": "2.7"}, {"title": "Статья 2.8. Отдых в части", "html": "<p>Для отдыха на территории части используются казарма, раздевалка и медицинский блок. Продолжительность отдыха не должна препятствовать службе.</p><p>Местами для отдыха являются:</p><ul><li>солдатские и курсантские казармы;</li><li>медицинский блок.</li></ul><p>Запрещено спать у общей раздевалки и в иных неположенных местах.</p>", "id": "ву-c1-a7", "num": "2.8"}, {"title": "Статья 2.9. Повышенная готовность", "html": "<p>При переходе в режим повышенной боевой готовности (Код-4) часть переходит в круглосуточный режим, весь состав находится в расположении части.</p><p>Объявление повышенной боевой готовности само по себе не отменяет действующие медицинские ограничения. Военнослужащему могут поручаться обязанности, совместимые с его состоянием здоровья и медицинским заключением. Изменение медицинских ограничений осуществляется уполномоченным военнослужащим медроты по результатам повторного осмотра.</p>", "id": "ву-c1-a8", "num": "2.9"}, {"title": "Статья 2.10. Плановые медицинские осмотры", "html": "<p>Медицинская рота ежедневно проводит выборочные медицинские осмотры личного состава по расписанию, составленному командиром Медицинской роты и согласованному с командованием части. Выборочный осмотр предусматривает обследование части личного состава и не означает обязательного ежедневного осмотра каждого военнослужащего.</p><p>В расписании определяются время, место проведения осмотра и подразделения, личный состав которых подлежит осмотру. Информация доводится до соответствующих подразделений заблаговременно.</p><p>Плановые медицинские осмотры проводятся независимо от вечерней проверки. Военнослужащий, несущий постовую службу, проходит плановый осмотр после сдачи поста сменяющему военнослужащему.</p><p>При необходимости экстренной медицинской помощи она оказывается безотлагательно. Командование организует замену постового и непрерывность охраны.</p><p>Содержание осмотров, порядок оформления результатов и установления медицинских ограничений определяются главой IX настоящего Устава.</p>", "id": "ву-c1-a9", "num": "2.10"}], "id": "ву-c1"}, {"title": "Глава III. Внешний вид и безопасность", "arts": [{"title": "Статья 3.1. Военная форма", "html": "<p>В расположении части и на официальных мероприятиях обязательна военная форма. Форма должна соответствовать подразделению и воинскому званию.</p>", "id": "ву-c2-a0", "num": "3.1"}, {"title": "Статья 3.2. Внешний вид и форма одежды", "html": "<p>Запрещаются спортивная и пляжная одежда, неопрятная одежда, яркие аксессуары, неустановленные знаки различия, криминальная или аморальная символика. Требования к прическе, бороде и усам устанавливаются настоящим Уставом и приказами командования.</p>", "id": "ву-c2-a1", "num": "3.2"}, {"title": "Статья 3.3. Требования к внешнему виду военнослужащих", "html": "<p>Новобранцы до присвоения звания младшего сержанта обязаны иметь полностью выбритую голову и не допускаются к службе при наличии растительности на лице.</p><p>Начиная со звания младшего сержанта, прическа военнослужащего должна быть аккуратной, соответствовать требованиям гигиены и не препятствовать ношению головных уборов, средств индивидуальной защиты, включая каску и противогаз.</p><p>Военнослужащим до звания полковник запрещено иметь на лице усы, отпускать бороду запрещено всем военнослужащим.</p>", "id": "ву-c2-a2", "num": "3.3"}, {"title": "Статья 3.4. Обращение с оружием", "html": "<p>Военнослужащий обязан относиться к оружию как к заряженному, не направлять его на людей без непосредственной необходимости, не держать палец на спусковом крючке до принятия решения о выстреле и быть уверенным в цели и обстановке за ней.</p>", "id": "ву-c2-a3", "num": "3.4"}, {"title": "Статья 3.4.1. Право на ношение табельного оружия", "html": "<p>Постоянное ношение табельного оружия при исполнении служебных обязанностей допускается всеми военнослужащими при наличии служебного удостоверения; наличие такового обязательно на период фактического несения караульно-постовой службы, патрулирования, учений, тренировок, специальных операций либо иной служебной деятельности.</p>", "id": "ву-c2-a4", "num": "3.4.1"}, {"title": "Статья 3.4.2. Сдача вооружения при выходе из части", "html": "<p>Военнослужащие в звании от рядового до подполковника включительно, покидающие территорию воинской части в гражданской форме, обязаны до выхода через контрольно-пропускной пункт сдать закреплённые за ними табельное оружие и боеприпасы на склад вооружения.</p><p>Специальное вооружение и специальные средства, полученные военнослужащим в установленном порядке и закреплённые за ним, сдаче на склад при выходе с территории воинской части не подлежат.</p><p>Запрещается оставлять табельное оружие и боеприпасы в личном транспортном средстве либо передавать их другому лицу без законных оснований.</p><p>Исключение: ношение табельного оружия в гражданской форме допускается военнослужащим ССО, ГРУ и Военной полиции при выполнении служебной или оперативной задачи, прямо предполагающей ношение оружия за пределами воинской части.</p>", "id": "ву-c2-a5", "num": "3.4.2"}, {"title": "Статья 3.5. Бодикамеры", "html": "<p>Бодикамера обязательна для сотрудников ВП, ОСБ, военнослужащих на КПП, патрулей и лиц, проводящих задержание. Наличие бодикамеры и включённой записи на период фактического несения караульно-постовой службы, патрулирований, специальных операций либо иной служебной деятельности обязательно. При неисправности камеры военнослужащий докладывает старшему и фиксирует обстоятельства в журнале. Ношение бодикамеры военнослужащими на территории части или полигона не запрещено.</p>", "id": "ву-c2-a6", "num": "3.5"}], "id": "ву-c2"}, {"title": "Глава IV. Структура и полномочия", "arts": [{"title": "Статья 4.1. Иерархия", "html": "<p>Иерархическая структура Армии: Генерал Армии; Генерал-Полковник Армии; Начальник ВС и его заместители; Начальник ФСВНГ и его заместители; командиры подразделений.</p>", "id": "ву-c3-a0", "num": "4.1"}, {"title": "Статья 4.2. Соотношение должности и воинского звания", "html": "<p>При исполнении служебных обязанностей должностное положение имеет приоритет над воинским званием. Военнослужащий, занимающий вышестоящую должность, является старшим по должности в отношении военнослужащих, занимающих нижестоящие должности, независимо от их воинского звания, в пределах предоставленных ему полномочий.</p>", "id": "ву-c3-a1", "num": "4.2"}, {"title": "Статья 4.3. Должностные лица", "html": "<p>Генерал Армии осуществляет общее руководство. Заместитель Генерала действует в пределах порученных полномочий. Начальники ВС и ФСВНГ организуют работу подчинённых структур. Командиры подразделений обеспечивают службу и дисциплину личного состава.</p>", "id": "ву-c3-a2", "num": "4.3"}, {"title": "Статья 4.4. Подразделения", "html": "<p>Военная полиция обеспечивает правопорядок и дисциплину. Медицинская рота организует медицинское обеспечение личного состава, оказывает медицинскую помощь, проводит медицинские осмотры, участвует в военно-врачебных комиссиях и оформляет медицинскую документацию. Полномочия Медицинской роты и порядок их реализации определяются главой IX настоящего Устава и приложением о хранении, учёте и выдаче медицинских препаратов и имущества. ГРУ, ССО, МСК, ОСБ, РВО, ОМОН, Военная академия и Военный комиссариат выполняют задачи в пределах своей компетенции и приказов командования.</p>", "id": "ву-c3-a3", "num": "4.4"}, {"title": "Статья 4.5. Зоны ответственности", "html": "<p>Армия охраняет территорию воинской части, военный комиссариат, полигон «Алабино» и иные объекты, закреплённые приказами командования. Охрана не предоставляет военнослужащим право самостоятельно назначать гражданским лицам наказание.</p><p>Приложение: полномочия по взысканиям. Командир подразделения вправе объявить устное предупреждение или выговор. Начальник ВС, Начальник ФСВНГ и их заместители вправе объявить строгий выговор и инициировать служебную проверку. Понижение в должности и увольнение рассматриваются Генералом Армии или уполномоченным им должностным лицом по результатам проверки. Полный перечень мер и порядок их применения определяются Дисциплинарным уставом.</p>", "id": "ву-c3-a4", "num": "4.5"}, {"title": "Статья 4.5.1. Военный полигон «Алабино»", "html": "<p>Военный полигон «Алабино» является учебно-тренировочной и режимной территорией Армии, предназначенной для проведения тактических занятий, учений, тренировок подразделений, отработки действий личного состава, эксплуатации военной техники и иных мероприятий боевой подготовки.</p><p>На территории полигона «Алабино» допускаются тренировки военнослужащих, передвижение и эксплуатация служебной военной техники, патрулирование и проведение учебных мероприятий при соблюдении требований безопасности, режима объекта и распоряжений командования.</p><p>Самовольный выезд военной техники за пределы полигона «Алабино», использование техники не по назначению, создание помех учебным мероприятиям, повреждение имущества или инфраструктуры полигона «Алабино» запрещаются.</p><p>Порядок охраны полигона «Алабино», перечень постов и правила патрулирования устанавливаются Уставом караульно-постовой службы.</p>", "id": "ву-c3-a5", "num": "4.5.1"}], "id": "ву-c3"}, {"title": "Глава V. Взаимодействие с гражданскими", "arts": [{"title": "Статья 5.1. Субординация", "html": "<p>Субординация является системой иерархических отношений, уважения дисциплины и исполнения законных приказов.</p>", "id": "ву-c4-a0", "num": "5.1"}, {"title": "Статья 5.2. Воинское приветствие", "html": "<p>Военнослужащие обязаны соблюдать правила воинского приветствия, доклада и обращения к старшим по званию.</p>", "id": "ву-c4-a1", "num": "5.2"}, {"title": "Статья 5.3. Действия в отношении граждан", "html": "<p>Военнослужащие вправе пресекать незаконное проникновение на территорию режимного объекта, ограничивать доступ, задерживать лицо при законных основаниях и передавать его ВП, МВД либо иному компетентному органу. Самостоятельное назначение наказания гражданским лицам не допускается.</p>", "id": "ву-c4-a2", "num": "5.3"}, {"title": "Статья 5.4. Применение силы", "html": "<p>Сила допускается только при нападении, непосредственной угрозе жизни, попытке незаконного проникновения или законном задержании. Посл
