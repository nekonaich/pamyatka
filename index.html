е применения силы обязательно: медицинская помощь при необходимости, доклад, фиксация на камеру и рапорт.</p>", "id": "ву-c4-a3", "num": "5.4"}], "id": "ву-c4"}, {"title": "Глава VI. Служебная связь", "arts": [{"title": "Статья 6.1. Теги подразделений", "html": "<p>В служебной связи используются утверждённые теги подразделений: ВП, МР, ГРУ, ССО, МСК, ВК, ОСБ, РВО, ОМОН и КС. Полковники и выше могут использовать связь без тега в порядке, установленном командованием.</p>", "id": "ву-c5-a0", "num": "6.1"}, {"title": "Статья 6.2. Коды обстановки", "html": "<ul><li>Код-1 — спокойная обстановка;</li><li>Код-2 — скопление подозрительных лиц или нарушение порядка;</li><li>Код-3 — проникновение, вооружённое нападение или массовое нарушение;</li><li>Код-4 — боевая тревога.</li></ul>", "id": "ву-c5-a1", "num": "6.2"}], "id": "ву-c5"}, {"title": "Глава VII. Регламент действий", "arts": [{"title": "Статья 7.1.1. Специальные операции", "html": "<p>Основная задача при поставках и специальных операциях — загрузка и доставка груза без утрат и задержек. Запрещены действия, препятствующие безопасности операции.</p>", "id": "ву-c6-a0", "num": "7.1.1"}, {"title": "Статья 7.1.2. Реакция на стрельбу", "html": "<p>ССО, ГРУ и ОМОН являются основными подразделениями реагирования. При непосредственной угрозе жизни, нападении на пост или проникновении любой военнослужащий действует в пределах необходимой обороны, докладывает по рации и вызывает группу реагирования.</p>", "id": "ву-c6-a1", "num": "7.1.2"}, {"title": "Статья 7.2. Военное положение", "html": "<p>При объявлении военного положения весь состав действует по распоряжениям Генерала Армии и командования, использует боевую форму и занимает назначенные позиции.</p>", "id": "ву-c6-a2", "num": "7.2"}, {"title": "Статья 7.3. Код-3", "html": "<p>При объявлении Кода-3 военнослужащий получает обмундирование, докладывает местоположение, направление и приметы нарушителя, а при наличии транспорта — марку, модель, цвет и номер. Подразделения действуют в пределах компетенции и приказов старшего.</p>", "id": "ву-c6-a3", "num": "7.3"}, {"title": "Статья 7.4. Обязанности постового", "html": "<p>Постовой обязан бдительно нести службу, требовать документы, не покидать пост до прибытия смены, немедленно докладывать о нештатной ситуации и применять оружие только в предусмотренных случаях.</p><p>При ухудшении состояния здоровья постовой незамедлительно докладывает по рации дежурному либо старшему наряда и вызывает медицинскую помощь. Для прохождения планового осмотра постовой покидает пост только после сдачи его сменяющему военнослужащему.</p><p>Если состояние здоровья исключает дальнейшее безопасное несение службы либо требует экстренной помощи, помощь оказывается безотлагательно, а командование организует замену и охрану объекта. При невозможности постового самостоятельно сообщить о своём состоянии доклад осуществляет обнаруживший его военнослужащий или медицинский работник.</p>", "id": "ву-c6-a4", "num": "7.4"}, {"title": "Статья 7.5. Единый порядок инцидента", "html": "<p>При обнаружении нарушения военнослужащий докладывает по рации, фиксирует обстоятельства на бодикамеру, ограничивает доступ или пресекает угрозу в пределах полномочий, вызывает ВП или дежурного, передаёт лицо уполномоченному сотруднику и оформляет рапорт.</p>", "id": "ву-c6-a5", "num": "7.5"}], "id": "ву-c6"}, {"title": "Глава VIII. Кадровая отчётность", "arts": [{"title": "Статья 8.1. Отчёты", "html": "<p>Отчёты подаются по утверждённой форме. При обнаружении ошибки создаётся новый отчёт в порядке, установленном командованием.</p>", "id": "ву-c7-a0", "num": "8.1"}, {"title": "Статья 8.2. Повышения", "html": "<p>Для повышения не должно быть активных дисциплинарных взысканий. Повышение проводится по системе подразделения и по представлению командира, согласованному с вышестоящим командованием.</p>", "id": "ву-c7-a1", "num": "8.2"}, {"title": "Статья 8.2.5. Повышение военнослужащего на посту", "html": "<p>Военнослужащий, несущий службу на посту, проходит процедуру повышения после сдачи поста либо через представителя подразделения.</p>", "id": "ву-c7-a2", "num": "8.2.5"}, {"title": "Статья 8.3. Повторный инструктаж", "html": "<p>После нарушения правил оружия, КПП, связи или постовой службы военнослужащий до повторного допуска проходит инструктаж или проверку знаний. Инструктаж не заменяет дисциплинарное взыскание, если оно подлежит применению.</p>", "id": "ву-c7-a3", "num": "8.3"}], "id": "ву-c7"}, {"title": "Глава IX. Медицинское обеспечение", "arts": [{"title": "Статья 9.1. Организация медицинского обеспечения", "html": "<p>Медицинская рота обеспечивает оказание медицинской помощи военнослужащим ВС и сотрудникам ФСВНГ, медицинское обеспечение которых возложено на неё действующими актами Округа.</p><p>Общее руководство Медицинской ротой осуществляет её командир. Медицинские действия выполняются военными врачами, фельдшерами и иными допущенными медицинскими работниками в пределах их подготовки и полномочий.</p><p>Медицинское обеспечение осуществляется с соблюдением законодательства, правил Округа и настоящего Устава. Внутренними распоряжениями не допускается предоставление полномочий, противоречащих законодательству или правилам Округа.</p>", "id": "ву-c8-a0", "num": "9.1"}, {"title": "Статья 9.2. Медицинские осмотры", "html": "<p>Медицинские осмотры проводятся в плановом порядке, по обращению военнослужащего, по направлению уполномоченного должностного лица либо при выявлении признаков ухудшения состояния здоровья.</p><p>Осмотр включает выяснение жалоб, оценку физического и психологического состояния в пределах компетенции медицинского работника, выявление заболеваний, ранений, ушибов, ссадин, вывихов и иных повреждений, а также оказание необходимой медицинской помощи.</p><p>Порядок проведения осмотров распространяется на личный состав независимо от звания и должности. Время планового осмотра руководящего состава согласовывается с учётом служебных обязанностей; при необходимости экстренной помощи такое согласование не требуется.</p><p>По результатам осмотра медицинский работник фиксирует выявленные обстоятельства, оказанную помощь и необходимые рекомендации. При наличии оснований оформляются направление на дополнительное обследование или заключение о временных медицинских ограничениях.</p><p>Результаты обследования должны соответствовать фактически установленным обстоятельствам и подтверждённым событиям игрового процесса. Медицинский осмотр не используется как мера наказания, давления или сведения личных счётов.</p>", "id": "ву-c8-a1", "num": "9.2"}, {"title": "Статья 9.3. Временное освобождение по медицинским основаниям", "html": "<p>Военнослужащий может быть временно освобождён от исполнения всех либо отдельных служебных обязанностей по медицинским основаниям.</p><p>Заключение оформляется военным врачом либо иным медицинским работником, которому такое полномочие прямо предоставлено действующими актами Округа. Участие в работе Медицинской роты само по себе не предоставляет права выдавать заключения об освобождении.</p><p>В заключении указываются сведения о военнослужащем; дата и время оформления; обязанности, от которых он освобождается, и установленные ограничения; начало и окончание срока действия; необходимость и срок повторного осмотра; имя и должность медицинского работника, оформившего заключение.</p><p>Медицинский работник устанавливает медицинские ограничения, а командование обеспечивает их исполнение и определяет допустимые служебные задачи. Командир не вправе самостоятельно отменять медицинское заключение или требовать выполнения прямо запрещённых им обязанностей.</p><p>При выявлении непосредственной угрозы здоровью медицинский работник требует прекращения опасной нагрузки, оказывает помощь и уведомляет командование. Дальнейшие ограничения оформляются уполномоченным медицинским работником.</p><p>Медицинское освобождение не является дисциплинарным взысканием и само по себе не изменяет должность, звание или принадлежность военнослужащего к подразделению.</p>", "id": "ву-c8-a2", "num": "9.3"}, {"title": "Статья 9.4. Повторный осмотр и возвращение к исполнению обязанностей", "html": "<p>При необходимости продления, изменения или досрочного прекращения медицинских ограничений проводится повторный осмотр. Его результат фиксируется в медицинской документации и доводится до командования в части, необходимой для организации службы.</p><p>Ограничения действуют в пределах срока, указанного в заключении. Если возвращение к определённым обязанностям требует контрольного осмотра, это прямо указывается в заключении.</p><p>При сохранении жалоб или ухудшении состояния военнослужащий обязан своевременно обратиться за повторной медицинской помощью и уведомить непосредственного командира.</p><p>При обоснованных сомнениях в заключении военнослужащий или командир вправе обратиться за его проверкой к уполномоченному медицинскому руководителю либо в медицинскую организацию. До пересмотра заключения установленные ограничения соблюдаются.</p>", "id": "ву-c8-a3", "num": "9.4"}, {"title": "Статья 9.5. Медицинская документация и учёт справок", "html": "<p>По результатам медицинских осмотров и оказания помощи медицинские работники оформляют записи в медицинской карточке военнослужащего и ведут учёт выданных справок, заключений и направлений.</p><p>Медицинская карточка содержит необходимые сведения о состоянии здоровья, результатах обследований, оказанной помощи, установленных ограничениях и последующих обращениях.</p><p>В личное дело военнослужащего передаются сведения, необходимые для кадрового учёта и организации службы: факт и срок освобождения, установленные ограничения и заключение о допуске к обязанностям. Подробные медицинские сведения хранятся в медицинской документации и передаются только при наличии предусмотренных оснований.</p><p>Формы документов, место их хранения и круг лиц, имеющих доступ, устанавливаются регламентом Медицинской роты с соблюдением законодательства Округа.</p><p>Запрещаются подделка медицинских документов, внесение заведомо недостоверных сведений, несанкционированное изменение или уничтожение записей и передача охраняемых медицинских сведений лицам, не имеющим права доступа.</p>", "id": "ву-c8-a4", "num": "9.5"}, {"title": "Статья 9.6. Направление на дополнительное обследование", "html": "<p>При необходимости уточнения состояния здоровья, проведения дополнительных обследований или получения специализированной помощи медицинский работник МР в пределах своих полномочий направляет военнослужащего в уполномоченную медицинскую организацию Округа.</p><p>В направлении указываются причина обращения, необходимые обследования или консультации и сведения, требуемые для оказания помощи. Передаётся выписка либо необходимая часть медицинской документации с соблюдением установленного порядка доступа к медицинским сведениям.</p><p>По результатам обследования полученное медицинское заключение приобщается к медицинской документации военнослужащего и учитывается при определении дальнейшей помощи и служебных ограничений.</p><p>При необходимости экстренной помощи предварительное оформление направления не должно задерживать её оказание.</p>", "id": "ву-c8-a5", "num": "9.6"}, {"title": "Статья 9.7. Военно-врачебная комиссия", "html": "<p>Медицинская рота совместно с Военным комиссариатом организует проведение военно-врачебной комиссии в отношении призывников и прибывших военнослужащих в случаях, предусмотренных действующими актами Округа.</p><p>Военные врачи и фельдшеры участвуют в обследовании в пределах своей компетенции. Представители Военного комиссариата обеспечивают организационное и кадровое сопровождение комиссии.</p><p>В ходе комиссии выясняются жалобы, оценивается физическое и психологическое состояние, выявляются заболевания, травмы и иные обстоятельства, влияющие на прохождение службы. При необходимости оформляются направления на дополнительные обследования и лечение.</p><p>Итоговое заключение о годности оформляется и подписывается уполномоченным медицинским составом комиссии. Участие в работе комиссии само по себе не предоставляет права определять годность военнослужащего.</p><p>Категории годности и последствия их установления определяются действующими актами Округа. Обычный медицинский осмотр или заключение о временном освобождении не заменяют заключение ВВК.</p><p>Кадровые решения по результатам комиссии принимаются уполномоченными должностными лицами на основании её заключения.</p>", "id": "ву-c8-a6", "num": "9.7"}, {"title": "Статья 9.8. Прикомандированные медики", "html": "<p>Прикомандированные медики сохраняют принадлежность к своему подразделению Армии и вправе оказывать медицинскую помощь в пределах подтверждённой подготовки и предоставленного допуска. В одном подразделении может состоять не более двух прикомандированных медиков.</p><p>По медицинским вопросам прикомандированные медики взаимодействуют с Медицинской ротой. Получение и использование ими медицинских препаратов и имущества осуществляется в порядке, установленном приложением к настоящему Уставу.</p><p>Статус прикомандированного медика сам по себе не предоставляет права определять категорию годности, выдавать заключения об освобождении от службы или распоряжаться запасами Медицинской роты.</p>", "id": "ву-c8-a7", "num": "9.8"}, {"title": "Статья 9.9. Медицинские препараты и имущество", "html": "<p>Хранение, учёт, выдача и использование медицинских препаратов, имущества и расходных материалов осуществляются в соответствии с законодательством Округа и приложением «Порядок хранения, учёта и выдачи медицинских препаратов и имущества».</p><p>Командир Медицинской роты организует исполнение указанного порядка. Медицинские работники и иные получатели имущества обязаны соблюдать установленные правила в пределах своих полномочий.</p>", "id": "ву-c8-a8", "num": "9.9"}], "id": "ву-c8"}, {"title": "Глава X. Территория ФСВНГ и порядок доступа", "arts": [{"title": "Статья 10.1. Статус территории ФСВНГ", "html": "<p>Территория Базы Федеральной службы войск национальной гвардии является закрытой служебной территорией ФСВНГ и закрепляется за подразделением для выполнения возложенных на него служебных задач.</p>", "id": "ву-c9-a0", "num": "10.1"}, {"title": "Статья 10.2. Порядок доступа на территорию ФСВНГ", "html": "<p>Свободный доступ на территорию Базы ФСВНГ предоставляется военнослужащим, проходящим службу в составе ФСВНГ. Военнослужащие иных подразделений могут находиться на территории исключительно с разрешения руководящего состава ФСВНГ либо по служебной необходимости.</p><p>Военнослужащим в звании Генерал-лейтенант и выше разрешается беспрепятственный проход и нахождение на территории Базы ФСВНГ без получения дополнительного разрешения.</p>", "id": "ву-c9-a1", "num": "10.2"}, {"title": "Статья 10.3. Ограничение доступа на территорию ФСВНГ", "html": "<p>Военнослужащим, не имеющим права свободного доступа или соответствующего разрешения, запрещается самовольно входить или иным способом проникать на территорию Базы ФСВНГ. По требованию военнослужащего ФСВНГ лицо, не имеющее разрешения на нахождение на территории, обязано незамедлительно её покинуть.</p>", "id": "ву-c9-a2", "num": "10.3"}, {"title": "Статья 10.4. Ответственность за нарушение режима территории", "html": "<p>Самовольное проникновение на территорию Базы ФСВНГ, отказ выполнить законное требование покинуть территорию, а также повторное нарушение установленного порядка доступа являются дисциплинарными нарушениями.</p><p>В зависимости от тяжести и повторности нарушения к военнослужащему применяются меры дисциплинарной ответственности, предусмотренные настоящим Уставом.</p>", "id": "ву-c9-a3", "num": "10.4"}, {"title": "Статья 10.5. Исключения из установленного порядка доступа", "html": "<p>Ограничения доступа не распространяются на случаи выполнения приказа вышестоящего командования, проведения заранее согласованных совместных мероприятий, возникновения чрезвычайной ситуации либо иных обстоятельств, при которых нахождение на территории необходимо для исполнения служебных обязанностей.</p>", "id": "ву-c9-a4", "num": "10.5"}], "id": "ву-c9"}, {"title": "Приложение: хранение, учёт и выдача медицинских препаратов и имущества", "arts": [{"title": "1. Общие положения", "html": "<p>1.1. Медицинские препараты, медицинское имущество и расходные материалы МР используются для медицинского обеспечения личного состава и иных разрешённых служебных задач.</p><p>1.2. Командир Медицинской роты организует хранение, учёт, распределение и выдачу имущества, определяет ответственных лиц и контролирует исполнение установленного порядка.</p><p>1.3. Ответственные лица и допущенные получатели определяются заранее. Порядок выдачи должен обеспечивать работу Медицинской роты при отсутствии её командира.</p><p>1.4. Медицинское имущество запрещается использовать для личной выгоды, несанкционированной продажи, обмена или передачи посторонним лицам.</p>", "id": "ву-c10-a0", "num": "1"}, {"title": "2. Хранение и доступ", "html": "<p>2.1. Медицинские препараты и имущество хранятся в специально определённых местах. Доступ к запасам предоставляется уполномоченным лицам.</p><p>2.2. Хранение организуется с учётом установленных условий, исправности имущества и сроков годности препаратов, если соответствующие требования предусмотрены игровыми механиками или актами Округа.</p><p>2.3. Непригодные, повреждённые и просроченные средства отделяются от пригодных к использованию и учитываются до принятия решения об их списании или передаче.</p><p>2.4. О выявленной недостаче, повреждении, утрате или несанкционированном доступе медицинский работник незамедлительно сообщает командиру МР либо ответственному лицу.</p>", "id": "ву-c10-a1", "num": "2"}, {"title": "3. Порядок выдачи и использования", "html": "<p>3.1. Выдачу из запасов МР осуществляет командир Медицинской роты либо уполномоченное ответственное лицо.</p><p>3.2. Препараты и имущество для служебной медицинской работы выдаются военным врачам, фельдшерам и прикомандированным медикам в пределах их допуска, полномочий и служебной необходимости.</p><p>3.3. Выдача медицинскому работнику складского запаса, выдача пациенту для лечения и выдача индивидуальных средств первой помощи учитываются как разные основания передачи.</p><p>3.4. Военнослужащим, не относящимся к медицинскому персоналу, допускается выдача препаратов для лечения и индивидуальных средств первой помощи в случаях, разрешённых законодательством и правилами Округа. Несанкционированная передача складских запасов запрещается.</p><p>3.5. Каждый факт выдачи фиксируется установленным способом. Допускается использование единой электронной формы учёта.</p><p>3.6. Оказание экстренной помощи допущенным медицинским работником не требует отдельного разрешения командира МР на каждое применение препарата. Если немедленная фиксация расхода препятствует оказанию помощи, запись вносится после завершения неотложных действий при первой возможности.</p><p>3.7. Получатель обязан использовать выданные средства исключительно по разрешённому назначению и соблюдать условия их хранения.</p>", "id": "ву-c10-a2", "num": "3"}, {"title": "4. Учёт и особый контроль", "html": "<p>4.1. Учёту подлежат поступление, выдача, расход, возврат, списание и остаток медицинских препаратов и имущества.</p><p>4.2. Запись о движении имущества должна позволять установить наименование, количество, основание операции, дату и время, получателя и лицо, оформившее операцию.</p><p>4.3. Препараты, подлежащие особому контролю по законодательству Округа, учитываются отдельно. Дополнительный внутренний перечень может устанавливаться утверждённым регламентом МР без изменения правового статуса препаратов.</p><p>4.4. При выдаче средств особого контроля дополнительно фиксируются цель использования и сведения, позволяющие проверить расход или возврат.</p><p>4.5. Запрещаются неучтённая выдача, сокрытие расхода или недостачи и внесение заведомо недостоверных сведений. Исправления должны сохранять возможность установить первоначальную запись, причину исправления и его автора.</p>", "id": "ву-c10-a3", "num": "4"}, {"title": "5. Проверки, возврат и ответственность", "html": "<p>5.1. Командир МР либо уполномоченное им лицо вправе проводить плановые и внеплановые проверки наличия, состояния и правильности учёта медицинских препаратов и имущества.</p><p>5.2. Неиспользованные средства возвращаются, если возврат предусмотрен порядком учёта и допускается с учётом их состояния. Непригодные средства не возвращаются в пригодный к использованию запас и оформляются отдельно.</p><p>5.3. Командир МР отвечает за организацию хранения и контроля. Ответственные сотрудники и получатели отвечают за исполнение возложенных на них обязанностей и сохранность переданного имущества.</p><p>5.4. Наличие недостачи или иного нарушения само по себе не доказывает виновность конкретного лица. Ответственность устанавливается после проверки обстоятельств в соответствии с Дисциплинарным уставом и законодательством Округа.</p><p>5.5. При наличии признаков преступления или административного правонарушения материалы передаются уполномоченному органу.</p>", "id": "ву-c10-a4", "num": "5"}], "id": "ву-c10"}, {"title": "Глава XI. Транспортная полиция", "arts": [{"title": "11.1. Общие положения", "html": "<p>Транспортная полиция (ТП) является специализированным подразделением Федеральной службы войск национальной гвардии, предназначенным для патрулирования территории, обеспечения общественного порядка, охраны объектов и оказания поддержки государственным структурам.</p>", "id": "ву-c11-a0", "num": "11.1"}, {"title": "11.2. Основные задачи ТП", "html": "<p>К основным задачам подразделения относятся:</p><ul><li>патрулирование территории города на служебном транспорте;</li><li>обеспечение и поддержание общественного порядка;</li><li>реагирование на нарушения и чрезвычайные ситуации в пределах полномочий подразделения;</li><li>обеспечение безопасности охраняемых объектов и организаций;</li><li>взаимодействие и оказание поддержки другим государственным структурам при необходимости.</li></ul>", "id": "ву-c11-a1", "num": "11.2"}, {"title": "11.3. Работа с организациями и бизнесами", "html": "<p>Сотрудники ТП вправе осуществлять охрану и обеспечение безопасности государственных и иных закреплённых за подразделением объектов, организаций и бизнесов, а также реагировать на поступившие от них обращения о необходимости помощи.</p>", "id": "ву-c11-a2", "num": "11.3"}, {"title": "11.4. Взаимодействие с государственными структурами", "html": "<p>ТП вправе оказывать поддержку другим государственным структурам при проведении совместных мероприятий, обеспечении общественного порядка, оцеплении территории, охране объектов и в иных служебных ситуациях по согласованию с руководством.</p>", "id": "ву-c11-a3", "num": "11.4"}, {"title": "11.5. Патрульная деятельность", "html": "<p>Патрулирование осуществляется сотрудниками ТП на служебном транспорте по установленным маршрутам либо в свободном порядке в зависимости от оперативной обстановки. Во время патрулирования сотрудники обязаны реагировать на выявленные нарушения и обращения граждан в пределах своих полномочий.</p>", "id": "ву-c11-a4", "num": "11.5"}, {"title": "11.6. Полномочия сотрудников ТП", "html": "<p>При исполнении служебных обязанностей сотрудники ТП вправе требовать прекращения противоправных действий, обеспечивать охрану территории и объектов, ограничивать доступ на охраняемую территорию при наличии служебных оснований, а также запрашивать содействие других государственных структур.</p>", "id": "ву-c11-a5", "num": "11.6"}, {"title": "11.7. Подчинение ТП", "html": "<p>Личный состав ТП подчиняется руководству подразделения, руководящему составу ФСВНГ и вышестоящему командованию в соответствии с установленной иерархией и Уставом ВС РО.</p>", "id": "ву-c11-a6", "num": "11.7"}, {"title": "11.8. Ограничения полномочий", "html": "<p>Сотрудникам ТП запрещается использовать полномочия подразделения в личных целях, превышать предоставленные Уставом полномочия либо вмешиваться в деятельность других государственных структур без служебной необходимости.</p>", "id": "ву-c11-a7", "num": "11.8"}], "id": "ву-c11"}]}, {"name": "Устав караульно-постовой службы", "url": "https://forum.russia.online/threads/%F0%9F%9B%91ustav-karaul-no-postovoi-sluzhby-vooruzhennykh-sil-i-federal-naya-sluzhba-voisk-natsional-noi-gvardii%F0%9F%9B%91.13874/", "abbr": "КПС", "cats": [{"title": "Преамбула и назначение службы", "arts": [{"title": "Преамбула", "html": "<p>Настоящий Устав определяет права и обязанности военнослужащих Вооружённых Сил (ВС) и Федеральной службы войск национальной гвардии (ФСВНГ), взаимоотношения между ними, обязанности основных должностных лиц и правила внутреннего порядка. Все военнослужащие, независимо от своих воинских званий и служебного положения, должны строго руководствоваться требованиями настоящего Устава.</p>", "id": "кпс-c0-a0", "num": ""}, {"title": "Статья 1.", "html": "<p>Настоящий Устав определяет предназначение, порядок организации и несения караульной службы, права и обязанности военнослужащих, несущих караульную службу, а также регламентирует порядок несения постовой службы военнослужащих ВС РФ, а также ФСВНГ.</p>", "id": "кпс-c0-a1", "num": "1"}, {"title": "Статья 2.", "html": "<p>Настоящим Уставом руководствуются все военнослужащие органов военного управления, воинских частей, органов военной полиции, федеральной службы войск национальной гвардии и лица гражданского персонала Вооружённых Сил Российской Федерации, замещающие воинские должности.</p>", "id": "кпс-c0-a2", "num": "2"}, {"title": "Статья 3.", "html": "<p>Караульная служба предназначена для надёжной охраны и обороны боевых знамён, хранилищ (складов) с вооружением, военной техникой, другим военным имуществом, объектов Вооружённых Сил Российской Федерации и иных военных и государственных объектов, а также для охраны военнослужащих, содержащихся на гауптвахте и в дисциплинарной части.</p>", "id": "кпс-c0-a3", "num": "3"}], "id": "кпс-c0"}, {"title": "Руководство и организация службы", "arts": [{"title": "Статья 4.", "html": "<p>Руководство караульной службой внутренних караулов воинских частей осуществляют командиры этих частей и их прямые начальники.</p>", "id": "кпс-c1-a0", "num": "4"}, {"title": "Статья 5.", "html": "<p>Приказы и распоряжения Министра обороны, командующих территориальными воинскими формированиями по организации и несению караульной службы обязательны для выполнения подведомственными воинскими формированиями, их военнослужащими и иными должностными лицами, входящими в состав конкретного субъекта.</p>", "id": "кпс-c1-a1", "num": "5"}, {"title": "Статья 6.", "html": "<p>Командующие воинскими формированиями обязаны периодически проверять качество несения караульной службы на подведомственных субъектах.</p>", "id": "кпс-c1-a2", "num": "6"}, {"title": "Статья 7.", "html": "<p>При расположении войск в полевых условиях мероприятия по поддержанию воинской дисциплины, охране субъектов воинских частей и военных объектов проводятся в соответствии с Уставами воинских формирований Вооружённых Сил Российской Федерации и настоящим Уставом.</p>", "id": "кпс-c1-a3", "num": "7"}, {"title": "Статья 8.", "html": "<p>Непосредственное выполнение задач караульной службы осуществляется подразделениями воинских частей, отделом собственной безопасности, а также военной комендатурой в пределах компетенции, определённой настоящим Уставом и Уставами конкретных воинских формирований.</p>", "id": "кпс-c1-a4", "num": "8"}, {"title": "Статья 12.", "html": "<p>Начальником караульной службы является командир части либо назначенное приказом должностное лицо.</p>", "id": "кпс-c1-a5", "num": "12"}], "id": "кпс-c1"}, {"title": "Обязанности военнослужащих", "arts": [{"title": "Статья 9.", "html": "<p>Каждый военнослужащий обязан оказывать требуемую помощь лицам, несущим караульную службу.</p>", "id": "кпс-c2-a0", "num": "9"}, {"title": "Статья 10.", "html": "<p>Каждый военнослужащий обязан знать в лицо своего командира или заместителя командира.</p>", "id": "кпс-c2-a1", "num": "10"}, {"title": "Статья 11.", "html": "<p>Военнослужащий, заметив нарушение правил несения службы кем-либо из состава наряда, караула, обязан немедленно сообщить об этом дежурному по части, в орган военной полиции или отдел собственной безопасности и доложить непосредственному командиру (начальнику).</p>", "id": "кпс-c2-a2", "num": "11"}], "id": "кпс-c2"}, {"title": "Виды караулов и охраняемые объекты", "arts": [{"title": "Статья 13.", "html": "<p>К постоянным караулам относятся караулы, перечень которых определяется настоящим Уставом и караульная служба на которых осуществляется непрерывно без необходимости оформления сопроводительных документов или письменных и (или) устных распоряжений на организацию и осуществление караулов.</p>", "id": "кпс-c3-a0", "num": "13"}, {"title": "Статья 14.", "html": "<p>Временные караулы создаются приказами командиров воинских частей (формирований) либо приказом (указом) Министра обороны Российской Федерации, Премьер-министра и иными должностными лицами, которым предоставлено такое право в соответствии с действующим законодательством Российской Федерации.</p>", "id": "кпс-c3-a1", "num": "14"}, {"title": "Статья 15.", "html": "<p>Перечень постоянных караулов на территории Московской области: воинская часть; территориальные военные объекты материального снабжения, склады с вооружением, стоянки военной техники, объекты стратегического (военного) значения; военный комиссариат Московской области, пункты отбора; государственные объекты материального снабжения.</p>", "id": "кпс-c3-a2", "num": "15"}, {"title": "Статья 16.", "html": "<p>Порядок несения караульной службы, перечень постов в караулах и порядок посещения указанных в статье 13 территорий определяется настоящим Уставом.</p>", "id": "кпс-c3-a3", "num": "16"}, {"title": "Статья 17.", "html": "<p>Порядок несения караульной службы и перечень постов в караулах на объектах материального снабжения и объекта стратегического значения защищён Федеральным законом «О государственной тайне» и устанавливается исключительно приказами командиров (начальников) воинских формирований в соответствии с подведомственностью.</p>", "id": "кпс-c3-a4", "num": "17"}, {"title": "Статья 18.", "html": "<p>Каждый из перечисленных в статье 13 настоящего Устава объект охраняется Вооружёнными Силами Российской Федерации.</p><p>18.1. Военные склады материального снабжения, склады с вооружением, стоянки военной техники, объекты стратегического (военного) значения, территории воинских частей являются закрытыми для свободного посещения и нахождения. Порядок прохода и пребывания на указанных территориях определяется Федеральным законом «О государственной собственности, закрытых и охраняемых территориях» и Федеральным законом «О Вооружённых Силах Российской Федерации».</p><p>18.2. Нахождение на иных территориях, не перечисленных в части 1 статьи 16 настоящего Устава, не ограничивается при соблюдении установленных правил поведения, за исключением обстоятельств, определяемых действующим законодательством.</p>", "id": "кпс-c3-a5", "num": "18"}], "id": "кпс-c3"}, {"title": "Постовая служба: заступление и перечень постов", "arts": [{"title": "Статья 19.", "html": "<p>Заступить на постовую службу в караулах может любой военнослужащий со звания Рядовой.</p>", "id": "кпс-c4-a0", "num": "19"}, {"title": "Статья 20.", "html": "<p>Перечень постов в каждом из постоянных караулов определяется настоящим Уставом, может дополняться и корректироваться в связи с определёнными обстоятельствами приказами командиров воинских частей (формирований), Министра обороны Российской Федерации.</p>", "id": "кпс-c4-a1", "num": "20"}, {"title": "Статья 21.", "html": "<p>Перечень постов во временно организуемых караулах определяется соответствующим приказом (указом) командиров (начальников), Министра обороны Российской Федерации, Премьер-министра, иных должностных лиц в пределах компетенции.</p>", "id": "кпс-c4-a2", "num": "21"}, {"title": "Статья 22.", "html": "<p>Перечень постов в карауле на территории воинской части: контрольно-пропускной пункт №1 (главный КПП); контрольно-пропускной пункт №2 (запасной КПП); вышки №1 — №8 по периметру воинской части; главный склад; военный полигон.</p>", "id": "кпс-c4-a3", "num": "22"}, {"title": "Статья 22.1.", "html": "<p>На территории военного полигона «Алабино» устанавливаются три постоянных поста:</p><ul><li>контрольно-пропускной пункт №1;</li><li>контрольно-пропускной пункт №2;</li><li>наблюдательная вышка.</li></ul><p>Оба КПП являются основными пунктами прохода, въезда и выезда на и с территории полигона.</p><p>Наблюдательная вышка предназначена для визуального контроля территории, выявления нарушений режима, незаконного проникновения, происшествий и своевременного доклада посредством связи. Дежурство на постах несут военнослужащие мотострелкового корпуса и роты вневедомственной охраны.</p>", "id": "кпс-c4-a4", "num": "22.1"}, {"title": "Статья 22.2.", "html": "<p>На территории военного полигона «Алабино» допускается пешее и автомобильное патрулирование.</p><p>Патрулирование может осуществляться военнослужащими, самостоятельно заступившими на патрульную службу, либо военнослужащими, действующими по распоряжению командования. Отдельное назначение на патруль не является обязательным условием его несения.</p><p>Патруль обязан контролировать режим территории, выявлять незаконное проникновение, обеспечивать безопасность вблизи зон проведения учений и тренировок, не препятствовать учебным мероприятиям и докладывать о выявленных нарушениях по рации.</p>", "id": "кпс-c4-a5", "num": "22.2"}, {"title": "Статья 23.", "html": "<p>Перечень постов в карауле на территории военного комиссариата, пунктов отбора: главный вход; призывной кабинет; дежурный пост.</p>", "id": "кпс-c4-a6", "num": "23"}, {"title": "Статья 24.", "html": "<p>Численность военнослужащих, одновременно несущих караульно-постовую службу на территории воинской части, устанавливается внутренними актами и должностными регламентами.</p>", "id": "кпс-c4-a7", "num": "24"}, {"title": "Статья 25.", "html": "<p>Старший наряда назначается приказом. Старшинство по званию применяется только при отсутствии назначенного старшего наряда.</p>", "id": "кпс-c4-a8", "num": "25"}], "id": "кпс-c4"}, {"title": "Приём и сдача поста, здоровье, снаряжение", "arts": [{"title": "Статья 26.", "html": "<p>При приёме и сдаче поста проверяются оружие, средства связи, состояние охраняемого объекта, наличие происшествий и замечаний. Смена фиксируется докладом в рацию.</p>", "id": "кпс-c5-a0", "num": "26"}, {"title": "Статья 26.1. Ухудшение состояния здоровья постового", "html": "<p>При ухудшении состояния здоровья постовой незамедлительно докладывает дежурному либо старшему наряда и запрашивает медицинскую помощь.</p><p>Для прохождения планового медицинского осмотра постовой сдаёт пост сменяющему военнослужащему в порядке статьи 26 настоящего Устава. Самостоятельный уход с поста для планового осмотра до сдачи поста не допускается.</p><p>Если состояние здоровья исключает безопасное продолжение службы либо требуется экстренная помощь, медицинская помощь оказывается безотлагательно. Дежурный либо старший наряда организует замену и обеспечивает непрерывность охраны объекта.</p><p>При невозможности постового самостоятельно доложить о своём состоянии доклад осуществляет обнаруживший его военнослужащий либо медицинский работник.</p><p>Военнослужащий с действующими медицинскими ограничениями не допускается к постовой службе, если её условия несовместимы с указанными ограничениями.</p><p>Доклад и передача поста осуществляются по служебной связи. Ведение отдельного журнала поста для этого не требуется.</p>", "id": "кпс-c5-a1", "num": "26.1"}, {"title": "Статья 27.", "html": "<p>Бодикамера обязательна для сотрудников ВП, ОСБ, военнослужащих на КПП, патрулей и лиц, проводящих задержание. При неисправности камеры военнослужащий докладывает старшему.</p>", "id": "кпс-c5-a2", "num": "27"}, {"title": "Статья 28.", "html": "<p>При заступлении на пост каждый военнослужащий обязан предварительно провести проверку табельного оружия и средств радиосвязи на предмет их исправности. При обнаружении неисправности в работе принять меры по устранению поломки либо заменить на исправные. Постовой или патрульный не вправе использовать полученное для службы оружие в личных целях, передавать его другим лицам либо покидать с ним территорию части без служебной необходимости.</p>", "id": "кпс-c5-a3", "num": "28"}], "id": "кпс-c5"}, {"title": "Запреты при несении постовой службы", "arts": [{"title": "Статья 29.", "html": "<p>При несении постовой службы запрещается: терять концентрацию, отвлекаться на телефон и иные электронные девайсы кроме рации, на разговоры; оставлять вооружение без контроля, снимать его с плеча без необходимости привести его в боевую готовность; нарушать действующее законодательство, особенно в области этики; игнорировать запросы о состоянии поста в рацию; своевременно не докладывать о состоянии поста; нарушать требования настоящего Устава в области организации пропуска на территорию и с территории объекта; бездействовать при совершении преступлений и (или) правонарушений на подведомственных территориях; бездействовать при просьбе оказания помощи гражданам и сотрудникам в пределах компетенции.</p><p>Военнослужащим во время несения постовой службы на любом посту запрещается танцевать и совершать иные действия, не связанные с исполнением служебных обязанностей. Разрешено совершать действия, непосредственно необходимые для выполнения уставных предписаний, применения разрешённого снаряжения или оказания медицинской помощи.</p>", "id": "кпс-c6-a0", "num": "29"}, {"title": "Статья 36. Запреты на КПП №1 и КПП №2", "html": "<p>Военнослужащим, несущим постовую службу на контрольно-пропускном пункте №1 и контрольно-пропускном пункте №2, запрещается:</p><ul><li>спать, сидеть и прислоняться к чему-либо;</li><li>читать, писать, петь;</li><li>есть, пить и курить;</li><li>принимать от кого-либо или передавать кому-либо предметы, не связанные с исполнением служебных обязанностей (запрет не распространяется на установленную передачу служебного имущества, получение разрешённых средств первой помощи и действия, необходимые для оказания медицинской помощи);</li><li>справлять естественные надобности на посту;</li><li>досылать патрон в патронник без необходимости, как и доставать оружие без необходимости;</li><li>использовать средства личной связи;</li><li>танцевать или совершать иные действия, не связанные с несением постовой службы.</li></ul>", "id": "кпс-c6-a1", "num": "36"}], "id": "кпс-c6"}, {"title": "КПП: обязанности и пропуск", "arts": [{"title": "Статья 30. Обязанности постового на КПП №1", "html": "<p>Постовой проверяет документы водителя, номер автомобиля, цель въезда/выезда и наличие записи в журнале транспортных средств. При отказе от предусмотренной проверки въезд/выезд не допускается. Постовой также проверяет документы прибывающих лиц, докладывает о нарушениях, пресекает незаконное проникновение в пределах полномочий и своевременно докладывает о состоянии поста.</p><p>Полковники, заместители начальников подразделений (отделов) и выше проходят без оформления увольнительной, но предъявляют служебное удостоверение.</p><p>При покидании территории воинской части или возвращении на неё на личном транспорте или без установленной формы одежды, независимо от занимаемой должности, военнослужащий обязан предъявить удостоверение постовому и не препятствовать осмотру багажника транспортного средства. (( Постовой вправе через отыгровку типа «/do Есть ли в машине @dynamicID запрещённые или нелегальные средства?»; игнорирование вопроса или заведомо ложный ответ наказывается по 5.9 ОПП. ))</p><p>Постовой вправе проводить досмотр военнослужащих, гражданских лиц, ручной клади и транспортных средств при въезде или выезде с территории воинской части в целях соблюдения пропускного режима, выявления запрещённых предметов и проверки законности ношения оружия, боеприпасов и специальных средств.</p><p>Военнослужащий, покидающий часть в гражданской форме, обязан по требованию постового подтвердить сдачу оружия и боеприпасов в порядке, установленном внутренним уставом (статья 3.4.2 ВУ). Полученное в установленном порядке специальное вооружение и специальные средства сдаче на склад не подлежат. При выявлении оружия или боеприпасов у лица, которое обязано было их сдать, постовой не допускает дальнейший выход с территории части и направляет лицо на склад вооружения для сдачи снаряжения.</p>", "id": "кпс-c7-a0", "num": "30"}, {"title": "Статья 31.", "html": "<p>Военнослужащие со звания генерал-лейтенант включительно освобождаются от проверок при пересечении любого из КПП, постовые обязаны знать их в лицо.</p>", "id": "кпс-c7-a1", "num": "31"}, {"title": "Статья 32. КПП №2", "html": "<p>КПП №2 является резервно-служебным и используется для проезда колонн снабжения, служебного транспорта, патрулей, правительственных кортежей, а также сотрудниками Военного комиссариата во время проведения призывных мероприятий.</p><p>Военнослужащие ВП и сотрудники ОСБ имеют право беспрепятственного проезда через КПП №2 при исполнении служебных обязанностей. Дополнительное разрешение на въезд или выезд через данный КПП для указанных сотрудников не требуется.</p>", "id": "кпс-c7-a2", "num": "32"}, {"title": "Статья 33.", "html": "<p>Обязанности военнослужащих на КПП №2 аналогичны обязанностям на КПП №1 и выполняются только в период законного использования КПП №2.</p>", "id": "кпс-c7-a3", "num": "33"}, {"title": "Статья 35.", "html": "<p>Разовые пропуска на территорию части уполномочены оформлять командиры военной полиции и руководство вооружённых сил.</p>", "id": "кпс-c7-a4", "num": "35"}], "id": "кпс-c7"}, {"title": "Личный транспорт на территории части", "arts": [{"title": "Статья 34.", "html": "<p>На территорию воинской части запрещается въезд на личных транспортных средствах, не зарегистрированных в установленном порядке в журнале транспортных средств. Регистрацию автомобиля санкционируют командиры ВП и ОСБ в пределах полномочий.</p>", "id": "кпс-c8-a0", "num": "34"}, {"title": "Статья 34.2.", "html": "<p>Въезд личного транспорта военнослужащих и гражданских лиц допускается исключительно через КПП №1. КПП №2 не используется для въезда личного транспорта.</p>", "id": "кпс-c8-a1", "num": "34.2"}, {"title": "Статья 34.3.", "html": "<p>Личный транспорт допускается при наличии записи в журнале транспортных средств и подтверждённой цели въезда.</p>", "id": "кпс-c8-a2", "num": "34.3"}, {"title": "Статья 34.4.", "html": "<p>После въезда личный транспорт следует по утверждённому маршруту на выделенную парковочную зону. Сквозной проезд по территории части, остановка у штаба, складов, казарм, автопарка, постов и иных режимных объектов запрещены.</p>", "id": "кпс-c8-a3", "num": "34.4"}, {"title": "Статья 34.5.", "html": "<p>Выезд личного транспорта производится через КПП №1. Допуск автомобиля может быть приостановлен или отменён при отсутствии транспортного средства в журнале.</p>", "id": "кпс-c8-a4", "num": "34.5"}], "id": "кпс-c8"}, {"title": "Режимный объект", "arts": [{"title": "Статья 37.", "html": "<p>Режимным объектом является территория внутри периметра части, доступ к которой осуществляется через КПП №1 и КПП №2. Территория с внешней стороны КПП режимным объектом не является. За пределами режимного объекта военнослужащие действуют в пределах закона и при необходимости вызывают компетентные органы.</p>", "id": "кпс-c9-a0", "num": "37"}], "id": "кпс-c9"}]}];
(function(){
  var order=["ДУ","КПС","ВУ"],names={"ДУ":"Дисциплинарный Устав","КПС":"Устав караульно-постовой службы","ВУ":"Устав Вооруженных Сил и ФСВНГ"};
  USTAV.sort(function(a,b){return order.indexOf(a.abbr)-order.indexOf(b.abbr)});
  USTAV.forEach(function(d){d.name=names[d.abbr]});
})();
var curDoc=0;
function renderUstav(){
  var chips=$("#doc-chips"),body=$("#doc-body");
  chips.innerHTML="";body.innerHTML="";
  chips.className="docs";
  USTAV.forEach(function(d,i){
    var n=0;d.cats.forEach(function(c){n+=c.arts.length});
    var b=document.createElement("button");b.type="button";b.className="doc";
    b.setAttribute("aria-pressed",i===curDoc);
    b.innerHTML='<strong>'+esc(d.name)+'</strong><span>'+d.cats.length+' категорий · '+n+' статей</span>';
    b.onclick=function(){curDoc=i;renderUstav();window.scrollTo({top:0})};
    chips.appendChild(b);
  });
  var d=USTAV[curDoc];
  var src=document.createElement("div");src.className="notice";
  src.innerHTML='<b>'+esc(d.name)+'.</b> Категорий: '+d.cats.length+'. Оригинал на форуме: <a href="'+d.url+'" target="_blank" rel="noopener noreferrer">открыть тему</a>.';
  body.appendChild(src);
  d.cats.forEach(function(cat){
    var h=document.createElement("h2");h.className="cat-h";h.id=cat.id;
    h.innerHTML=esc(cat.title)+' <small>'+cat.arts.length+'</small>';
    body.appendChild(h);
    cat.arts.forEach(function(art){
      var c=cardEl({title:art.title,html:art.html});c.id=art.id;body.appendChild(c);
    });
  });
  var bs=BASIS[d.abbr];
  if(bs){
    var bc=document.createElement("article");bc.className="card basis";bc.id="basis-"+d.abbr;
    bc.innerHTML='<span class="tag">Итог</span><h3>'+esc(bs.title)+'</h3><ul>'+bs.items.map(function(t){return '<li>'+esc(t)+'</li>'}).join("")+'</ul>';
    body.appendChild(bc);
  }
}

/* ============ утилиты ============ */
var $ = function(s,r){return (r||document).querySelector(s)};
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function plain(html){var d=document.createElement("div");d.innerHTML=html;return d.textContent.replace(/\s+/g," ").trim()}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function cardEl(c,from){
  var a=document.createElement("article");
  a.className="card"+(c.wide?" wide":"");
  a.innerHTML=(from?'<span class="from">'+from+'</span>':'')+(c.topic?'<span class="tag">'+esc(c.topic)+'</span>':'')+'<h3>'+esc(c.title)+'</h3>'+c.html;
  return a;
}

function highlight(root,q){
  if(!q) return;
  var re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"giu");
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),nodes=[],n;
  while((n=w.nextNode())) nodes.push(n);
  nodes.forEach(function(node){
    if(!re.test(node.nodeValue)){re.lastIndex=0;return}
    re.lastIndex=0;
    var frag=document.createDocumentFragment(),last=0,m,txt=node.nodeValue;
    while((m=re.exec(txt))){
      if(m[0]==="")break;
      frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
      var mk=document.createElement("mark");mk.textContent=m[0];frag.appendChild(mk);
      last=m.index+m[0].length;
    }
    frag.appendChild(document.createTextNode(txt.slice(last)));
    node.parentNode.replaceChild(frag,node);
  });
}

/* ============ вкладки ============ */
var tabs={memo:"t-memo",ustav:"t-ustav",lec:"t-lec",exam:"t-exam"};
function showTab(k){
  Object.keys(tabs).forEach(function(key){
    var on=key===k;
    $("#"+tabs[key]).setAttribute("aria-selected",on);
    $("#p-"+key).hidden=!on;
  });
  $("#p-search").hidden=true;
  $("#q").value="";$("#clr").style.display="none";
  try{history.replaceState(null,"","#"+k)}catch(e){}
}
Object.keys(tabs).forEach(function(k){$("#"+tabs[k]).addEventListener("click",function(){showTab(k)})});

/* ============ памятка ============ */
var curTopic="Все";
function renderMemo(){
  var g=$("#memo-grid");g.innerHTML="";
  MEMO.filter(function(c){return curTopic==="Все"||c.topic===curTopic}).forEach(function(c){g.appendChild(cardEl(c))});
}
function renderChips(){
  var box=$("#chips");box.innerHTML="";
  TOPICS.forEach(function(t){
    var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=t;
    b.setAttribute("aria-pressed",t===curTopic);
    b.onclick=function(){curTopic=t;renderChips();renderMemo()};
    box.appendChild(b);
  });
}

/* ============ лекция ============ */
function renderLecture(){
  var toc=$("#toc"),body=$("#lec-body");toc.innerHTML="";body.innerHTML="";
  LECTURE.forEach(function(s){
    var a=document.createElement("a");a.href="#"+s.id;a.textContent=s.title.replace(/^\d+\.\s*/,"");
    a.onclick=function(e){e.preventDefault();document.getElementById(s.id).scrollIntoView({behavior:"smooth",block:"start"})};
    toc.appendChild(a);
    var c=cardEl({title:s.title,html:s.html});c.id=s.id;body.appendChild(c);
  });
}

/* ============ поиск ============ */
var INDEX=[];
MEMO.forEach(function(c){INDEX.push({src:"Памятка",c:c,text:(c.topic+" "+c.title+" "+plain(c.html)).toLowerCase()})});
USTAV.forEach(function(d){d.cats.forEach(function(cat){cat.arts.forEach(function(a){
  var tok=a.num?(" ст. "+a.num+" ст "+a.num+" статья "+a.num):"";
  INDEX.push({src:d.abbr,c:{topic:cat.title,title:a.title,html:a.html},text:(d.abbr+" "+d.name+" "+cat.title+" "+a.title+" "+plain(a.html)+tok).toLowerCase()});
})})});
Object.keys(BASIS).forEach(function(k){var b=BASIS[k];INDEX.push({src:k,c:{topic:"Итог",title:b.title,html:"<ul>"+b.items.map(function(t){return "<li>"+esc(t)+"</li>"}).join("")+"</ul>"},text:(k+" "+b.title+" "+b.items.join(" ")).toLowerCase()})});
LECTURE.forEach(function(c){INDEX.push({src:"Лекция",c:c,text:(c.title+" "+plain(c.html)).toLowerCase()})});

function runSearch(){
  var raw=$("#q").value.trim(),box=$("#p-search");
  $("#clr").style.display=raw?"block":"none";
  if(!raw){
    box.hidden=true;
    var cur=Object.keys(tabs).filter(function(k){return $("#"+tabs[k]).getAttribute("aria-selected")==="true"})[0]||"memo";
    $("#p-"+cur).hidden=false;return;
  }
  Object.keys(tabs).forEach(function(k){$("#p-"+k).hidden=true});
  box.hidden=false;
  var q=raw.toLowerCase();
  var hits=INDEX.filter(function(x){return x.text.indexOf(q)>-1});
  box.innerHTML="";
  var h=document.createElement("h2");h.className="results-head";
  h.textContent=hits.length?("Найдено: "+hits.length):"Ничего не найдено";
  box.appendChild(h);
  if(!hits.length){
    var e=document.createElement("div");e.className="empty";
    e.textContent="Попробуйте короче или другое слово, например «строй», «приказ», «выговор».";
    box.appendChild(e);return;
  }
  var grid=document.createElement("div");grid.className="grid";
  hits.forEach(function(x){
    var el=cardEl(x.c,x.src);el.classList.remove("wide");highlight(el,raw);grid.appendChild(el);
  });
  box.appendChild(grid);
}
$("#q").addEventListener("input",runSearch);
$("#clr").addEventListener("click",function(){$("#q").value="";runSearch();$("#q").focus()});
document.addEventListener("keydown",function(e){
  if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("#q").focus()}
  if(e.key==="Escape"&&document.activeElement===$("#q")){$("#q").value="";runSearch();$("#q").blur()}
});

/* ============ экзамен ============ */
var qz={list:[],i:0,score:0,wrong:[],locked:false};
function quizHome(){
  var box=$("#quiz");
  box.innerHTML='<div class="setup"><div class="card"><span class="tag">Экзамен</span><h3>Проверьте себя</h3><p>«Экзамен»: 15 случайных вопросов из банка в '+EXAM.length+' вопросов. «Проверь себя»: все вопросы подряд. После каждого ответа показываю, почему он верный.</p><div class="row" id="modes"></div></div></div>';
  var m=$("#modes");
  function add(label,fn,alt){var b=document.createElement("button");b.className="btn"+(alt?" alt":"");b.textContent=label;b.onclick=fn;m.appendChild(b)}
  add("Экзамен: 15 вопросов",function(){startQuiz(shuffle(EXAM).slice(0,15))});
  add("Проверь себя",function(){startQuiz(shuffle(EXAM))},true);
}
function startQuiz(list){qz={list:list,i:0,score:0,wrong:[],locked:false};showQ()}
function showQ(){
  var box=$("#quiz"),item=qz.list[qz.i];
  var opts=shuffle(item.a.map(function(t,idx){return {t:t,ok:idx===0}}));
  box.innerHTML='<div class="qbar"><span>Вопрос '+(qz.i+1)+' из '+qz.list.length+'</span><span>Верно: '+qz.score+'</span></div><div class="progress"><i style="width:'+(qz.i/qz.list.length*100)+'%"></i></div><div class="qcard"><span class="tag">'+esc(item.t)+'</span><h2>'+esc(item.q)+'</h2><div class="opts" id="opts"></div><div id="fb"></div></div>';
  var o=$("#opts"),letters="АБВГ";
  opts.forEach(function(op,idx){
    var b=document.createElement("button");b.className="opt";b.type="button";
    b.innerHTML='<span class="l">'+letters[idx]+'</span><span>'+esc(op.t)+'</span>';
    b.onclick=function(){answer(b,op,opts,item)};
    o.appendChild(b);
  });
  qz.locked=false;
}
function answer(btn,op,opts,item){
  if(qz.locked)return;qz.locked=true;
  var btns=$("#opts").children;
  for(var i=0;i<btns.length;i++){
    btns[i].disabled=true;
    if(opts[i].ok)btns[i].classList.add("right");
  }
  if(op.ok){qz.score++}else{btn.classList.add("wrong");qz.wrong.push(item)}
  var last=qz.i===qz.list.length-1;
  $("#fb").innerHTML='<div class="why"><b>'+(op.ok?"Верно. ":"Неверно. ")+'</b>'+esc(item.why)+'</div><div class="row"><button class="btn" id="next">'+(last?"Показать результат":"Дальше")+'</button></div>';
  $("#next").focus();
  $("#next").onclick=function(){qz.i++;last?finish():showQ()};
}
function finish(){
  var n=qz.list.length,p=Math.round(qz.score/n*100);
  var verdict=p>=90?"Отлично, можно сдавать.":p>=70?"Хорошо, повторите ошибки.":"Пока рано, перечитайте памятку и лекцию.";
  var box=$("#quiz");
  box.innerHTML='<div class="qcard"><span class="tag">Результат</span><div class="score">'+qz.score+' / '+n+'</div><p>'+p+'%. '+verdict+'</p><div id="mist"></div><div class="row" id="fin"></div></div>';
  if(qz.wrong.length){
    var ul='<h3 style="margin:14px 0 8px">Разбор ошибок</h3><ul class="mistakes">';
    qz.wrong.forEach(function(x){ul+='<li><b>'+esc(x.q)+'</b><small>Верно: '+esc(x.a[0])+'</small><small>'+esc(x.why)+'</small></li>'});
    $("#mist").innerHTML=ul+'</ul>';
  }
  var f=$("#fin");
  function add(label,fn,alt){var b=document.createElement("button");b.className="btn"+(alt?" alt":"");b.textContent=label;b.onclick=fn;f.appendChild(b)}
  if(qz.wrong.length)add("Повторить только ошибки",function(){startQuiz(shuffle(qz.wrong))});
  add("Новый экзамен",function(){startQuiz(shuffle(EXAM).slice(0,15))},true);
  add("В меню",quizHome,true);
  window.scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("click",function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains("poster-img")){
    var o=document.createElement("div");o.className="lightbox";o.innerHTML='<img src="'+t.src+'" alt="'+esc(t.alt)+'">';
    o.onclick=function(){o.remove()};document.body.appendChild(o);
  }
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){var l=document.querySelector(".lightbox");if(l)l.remove()}});

/* ============ старт ============ */
renderChips();renderMemo();renderUstav();renderLecture();quizHome();
var h=(location.hash||"").slice(1);if(tabs[h])showTab(h);
</script>
</body>
</html>
